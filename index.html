<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Administrasi Warga - NUANSA 16A C3/C8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#15803d',
                        success: '#22c55e',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        bgapp: '#f0fdf4',
                        darker: '#14532d'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bgapp text-slate-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [user, setUser] = React.useState(null);
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [stats, setStats] = React.useState({});
            const [members, setMembers] = React.useState([]);
            const [leaders, setLeaders] = React.useState([]);
            const [assets, setAssets] = React.useState([]);
            const [announcements, setAnnouncements] = React.useState([]);
            const [auditLogs, setAuditLogs] = React.useState([]);
            const [searchQuery, setSearchQuery] = React.useState('');
            const [mobileMenuOpen, setMobileMenuOpen] = React.useState(false);
            
            // Modal Input Warga
            const [showModalWarga, setShowModalWarga] = React.useState(false);
            const [formWarga, setFormWarga] = React.useState({ nik: '', nama: '', alamat: '', no_hp: '', kategori: 'Warga Tetap', status_iuran: 'Belum Bayar', tabungan_cor: 0, tunggakan: 0, keterangan: '' });

            // Login Form State
            const [loginEmail, setLoginEmail] = React.useState('');
            const [loginPassword, setLoginPassword] = React.useState('');
            const [loginError, setLoginError] = React.useState('');

            const [timeStr, setTimeStr] = React.useState('');
            const [dateStr, setDateStr] = React.useState('');

            // Logo Aman & Anti-Error
            const logoUrl = "https://placehold.co/150x150/14532d/ffffff?text=16A";

            React.useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    setTimeStr(now.toLocaleTimeString('id-ID'));
                    setDateStr(now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }));
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const fetchData = async () => {
                try {
                    const resStats = await fetch('/api/dashboard/stats');
                    const dStats = await resStats.json();
                    if (dStats.success) setStats(dStats.stats);

                    const resMem = await fetch('/api/members');
                    const dMem = await resMem.json();
                    if (dMem.success) setMembers(dMem.data);

                    const resLead = await fetch('/api/leaders');
                    const dLead = await resLead.json();
                    if (dLead.success) setLeaders(dLead.data);

                    const resAsset = await fetch('/api/assets');
                    const dAsset = await resAsset.json();
                    if (dAsset.success) setAssets(dAsset.data);

                    const resAnno = await fetch('/api/announcements');
                    const dAnno = await resAnno.json();
                    if (dAnno.success) setAnnouncements(dAnno.data);

                    const resAudit = await fetch('/api/audit-logs');
                    const dAudit = await resAudit.json();
                    if (dAudit.success) setAuditLogs(dAudit.data);
                } catch (e) {
                    console.error('Gagal mengambil data:', e);
                }
            };

            React.useEffect(() => {
                if (user) {
                    fetchData();
                    const interval = setInterval(fetchData, 5000);
                    return () => clearInterval(interval);
                }
            }, [user]);

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                setLoginError('');
                try {
                    const res = await fetch('/api/login/admin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: loginEmail, password: loginPassword })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setUser(data.user);
                    } else {
                        setLoginError(data.message || 'Login gagal.');
                    }
                } catch (err) {
                    setLoginError('Terjadi kesalahan koneksi.');
                }
            };

            const handleSaveWarga = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/members', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ...formWarga, actor: user.nama })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setShowModalWarga(false);
                        setFormWarga({ nik: '', nama: '', alamat: '', no_hp: '', kategori: 'Warga Tetap', status_iuran: 'Belum Bayar', tabungan_cor: 0, tunggakan: 0, keterangan: '' });
                        fetchData();
                    }
                } catch (err) {
                    alert('Gagal menyimpan data warga');
                }
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-darker px-4">
                        <div className="bg-white max-w-md w-full rounded-3xl shadow-2xl p-8 border border-emerald-800">
                            <div className="text-center mb-6">
                                <img src={logoUrl} alt="Logo NUANSA 16A" className="w-24 h-24 object-cover rounded-2xl mx-auto shadow-lg mb-4 border-2 border-primary" />
                                <h1 className="text-2xl font-black text-darker">NUANSA 16A C3/C8</h1>
                                <p className="text-xs font-semibold text-primary mt-1">Sistem Administrasi Warga Digital</p>
                            </div>
                            {loginError && <div className="mb-4 p-3 bg-red-50 text-red-600 rounded-xl text-sm border border-red-200">{loginError}</div>}
                            <form onSubmit={handleAdminLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Email Super Admin</label>
                                    <input type="email" required value={loginEmail} onChange={e => setLoginEmail(e.target.value)} className="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary focus:outline-none text-sm bg-slate-50" placeholder="admin@nuansa16a.com" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Password</label>
                                    <input type="password" required value={loginPassword} onChange={e => setLoginPassword(e.target.value)} className="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary focus:outline-none text-sm bg-slate-50" placeholder="••••••••••••" />
                                </div>
                                <button type="submit" className="w-full py-3.5 bg-primary hover:bg-darker text-white font-bold rounded-2xl shadow-lg transition duration-200 text-sm">Masuk Sistem</button>
                            </form>
                        </div>
                    </div>
                );
            }

            const filteredMembers = members.filter(m => 
                m.nama.toLowerCase().includes(searchQuery.toLowerCase()) || 
                (m.alamat && m.alamat.toLowerCase().includes(searchQuery.toLowerCase()))
            );

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-bgapp">
                    {/* Mobile Header */}
                    <div className="md:hidden bg-darker text-white px-4 py-3 flex justify-between items-center shadow-md">
                        <div className="flex items-center space-x-3">
                            <img src={logoUrl} alt="Logo" className="w-8 h-8 rounded-lg object-cover" />
                            <span className="font-bold text-sm">NUANSA 16A C3/C8</span>
                        </div>
                        <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="text-white text-xl focus:outline-none">
                            <i className={`fa-solid ${mobileMenuOpen ? 'fa-xmark' : 'fa-bars'}`}></i>
                        </button>
                    </div>

                    {/* Sidebar / Drawer */}
                    <aside className={`w-full md:w-72 bg-darker text-slate-200 flex flex-col justify-between shadow-2xl z-20 transition-all duration-300 ${mobileMenuOpen ? 'block' : 'hidden md:flex'}`}>
                        <div>
                            <div className="p-6 border-b border-emerald-900 flex items-center space-x-3.5 bg-emerald-950/40">
                                <img src={logoUrl} alt="Logo NUANSA" className="w-12 h-12 rounded-xl object-cover shadow-md border border-emerald-600" />
                                <div>
                                    <h2 className="font-black text-white text-base tracking-wide">NUANSA 16A</h2>
                                    <p className="text-xs text-success font-bold">Blok C3 / C8 Karawang</p>
                                </div>
                            </div>
                            <nav className="p-4 space-y-1.5 text-sm font-medium">
                                <button onClick={() => { setActiveTab('dashboard'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'dashboard' ? 'bg-primary text-white shadow-lg font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}>
                                    <i className="fa-solid fa-chart-pie w-5 text-success"></i><span>Dashboard Eksekutif</span>
                                </button>
                                <button onClick={() => { setActiveTab('warga'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'warga' ? 'bg-primary text-white shadow-lg font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}>
                                    <i className="fa-solid fa-users w-5 text-success"></i><span>Data Warga</span>
                                </button>
                                <button onClick={() => { setActiveTab('pengurus'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'pengurus' ? 'bg-primary text-white shadow-lg font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}>
                                    <i className="fa-solid fa-user-tie w-5 text-success"></i><span>Data Pengurus</span>
                                </button>
                                <button onClick={() => { setActiveTab('aset'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'aset' ? 'bg-primary text-white shadow-lg font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}>
                                    <i className="fa-solid fa-boxes-stacked w-5 text-success"></i><span>Data Aset</span>
                                </button>
                                <button onClick={() => { setActiveTab('audit'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'audit' ? 'bg-primary text-white shadow-lg font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}>
                                    <i className="fa-solid fa-shield-halved w-5 text-success"></i><span>Audit Log</span>
                                </button>
                                <button onClick={() => { setActiveTab('backup'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'backup' ? 'bg-primary text-white shadow-lg font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}>
                                    <i className="fa-solid fa-database w-5 text-success"></i><span>Backup Database</span>
                                </button>
                            </nav>
                        </div>
                        <div className="p-4 border-t border-emerald-900 bg-emerald-950/20">
                            <div className="mb-3 px-3">
                                <p className="text-xs text-emerald-400 font-semibold">Login sebagai:</p>
                                <p className="text-sm font-bold text-white truncate">{user.nama}</p>
                            </div>
                            <button onClick={() => setUser(null)} className="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold shadow transition">Keluar Sistem</button>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col min-w-0 overflow-y-auto relative bg-gradient-to-br from-emerald-50/50 via-white to-emerald-50/30">
                        {/* Top Navbar */}
                        <header className="bg-white/90 backdrop-blur-md border-b border-emerald-100 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4 sticky top-0 z-10 shadow-sm">
                            <div className="flex items-center space-x-4 w-full sm:w-auto">
                                <div className="relative w-full sm:w-80">
                                    <span className="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i className="fa-solid fa-magnifying-glass"></i></span>
                                    <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Cari warga, alamat..." className="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-primary shadow-inner" />
                                </div>
                            </div>
                            <div className="flex items-center space-x-4 text-xs sm:text-sm text-slate-600 font-semibold">
                                <div className="bg-emerald-50 text-darker px-3.5 py-2 rounded-2xl border border-emerald-200 flex items-center space-x-2 shadow-sm">
                                    <i className="fa-regular fa-calendar text-primary"></i><span>{dateStr}</span> | <i className="fa-regular fa-clock text-primary"></i><span>{timeStr}</span>
                                </div>
                            </div>
                        </header>

                        {/* Content Container */}
                        <div className="p-4 sm:p-8 z-10 flex-1">
                            {activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-5">
                                        <div className="bg-white/90 backdrop-blur-sm p-6 rounded-3xl shadow-sm border border-emerald-100 hover:shadow-md transition">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Pengeluaran</p>
                                            <h3 className="text-xl sm:text-2xl font-black text-red-600 mt-2">Rp 0</h3>
                                            <p className="text-xs text-slate-500 mt-1">Total pengeluaran kas</p>
                                        </div>
                                        <div className="bg-white/90 backdrop-blur-sm p-6 rounded-3xl shadow-sm border border-emerald-100 hover:shadow-md transition">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Saldo Total Kas</p>
                                            <h3 className="text-xl sm:text-2xl font-black text-darker mt-2">Rp {(stats.saldoKas || 0).toLocaleString()}</h3>
                                            <p className="text-xs text-success mt-1 font-bold">Aktif Realtime</p>
                                        </div>
                                        <div className="bg-white/90 backdrop-blur-sm p-6 rounded-3xl shadow-sm border border-emerald-100 hover:shadow-md transition">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Saldo Cor Jalan</p>
                                            <h3 className="text-xl sm:text-2xl font-black text-darker mt-2">Rp {(stats.saldoCor || 0).toLocaleString()}</h3>
                                            <p className="text-xs text-slate-500 mt-1">Tabungan Cor</p>
                                        </div>
                                        <div className="bg-white/90 backdrop-blur-sm p-6 rounded-3xl shadow-sm border border-emerald-100 hover:shadow-md transition">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Saldo Jimpitan</p>
                                            <h3 className="text-xl sm:text-2xl font-black text-darker mt-2">Rp {(stats.saldoJimpitan || 0).toLocaleString()}</h3>
                                            <p className="text-xs text-slate-500 mt-1">Jimpitan warga</p>
                                        </div>
                                        <div className="bg-white/90 backdrop-blur-sm p-6 rounded-3xl shadow-sm border border-emerald-100 hover:shadow-md transition">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Agenda Kegiatan Gang</p>
                                            <h3 className="text-xl sm:text-2xl font-black text-primary mt-2">Aktif</h3>
                                            <p className="text-xs text-slate-500 mt-1">RT 44 / RW 13 C3/C8</p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'warga' && (
                                <div className="bg-white/90 backdrop-blur-sm rounded-3xl shadow-sm border border-emerald-100 p-6">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                        <div>
                                            <h3 className="text-lg font-black text-darker">Data Warga & Status Iuran</h3>
                                            <p className="text-xs text-slate-500">Daftar lengkap status iuran, tabungan cor, dan tunggakan warga.</p>
                                        </div>
                                        {user.role === 'SUPER_ADMIN' && (
                                            <button onClick={() => setShowModalWarga(true)} className="px-5 py-2.5 bg-primary hover:bg-darker text-white font-bold rounded-2xl text-xs shadow-md transition flex items-center space-x-2">
                                                <i className="fa-solid fa-plus"></i><span>Input Warga Baru</span>
                                            </button>
                                        )}
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm text-slate-600">
                                            <thead className="bg-emerald-50/70 text-darker font-bold border-b border-emerald-100 text-xs uppercase tracking-wider">
                                                <tr>
                                                    <th className="p-3.5 rounded-l-xl">Nama Warga</th>
                                                    <th className="p-3.5">Alamat</th>
                                                    <th className="p-3.5">No HP</th>
                                                    <th className="p-3.5">Status Iuran</th>
                                                    <th className="p-3.5">Tabungan Cor</th>
                                                    <th className="p-3.5">Tunggakan</th>
                                                    <th className="p-3.5 rounded-r-xl">Keterangan</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {filteredMembers.map(m => (
                                                    <tr key={m.id} className="border-b border-slate-100 hover:bg-emerald-50/30 transition">
                                                        <td className="p-3.5 font-bold text-slate-900">{m.nama}</td>
                                                        <td className="p-3.5">{m.alamat || '-'}</td>
                                                        <td className="p-3.5">{m.no_hp || '-'}</td>
                                                        <td className="p-3.5">
                                                            <span className={`px-3 py-1 rounded-xl text-xs font-bold ${m.status_iuran === 'Sudah Bayar' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-700'}`}>
                                                                {m.status_iuran || 'Belum Bayar'}
                                                            </span>
                                                        </td>
                                                        <td className="p-3.5 font-bold text-primary">Rp {(m.tabungan_cor || 0).toLocaleString()}</td>
                                                        <td className="p-3.5 text-red-600 font-bold">Rp {(m.tunggakan || 0).toLocaleString()}</td>
                                                        <td className="p-3.5 text-slate-500">{m.keterangan || '-'}</td>
                                                    </tr>
                                                ))}
                                                {filteredMembers.length === 0 && <tr><td colSpan="7" className="p-8 text-center text-slate-400">Belum ada data warga.</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'aset' && (
                                <div className="bg-white/90 backdrop-blur-sm rounded-3xl shadow-sm border border-emerald-100 p-6">
                                    <h3 className="text-lg font-black text-darker mb-4">Data Aset Lingkungan</h3>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm text-slate-600">
                                            <thead className="bg-emerald-50/70 text-darker font-bold border-b border-emerald-100 text-xs uppercase tracking-wider">
                                                <tr>
                                                    <th className="p-3.5 rounded-l-xl">Nama Aset</th>
                                                    <th className="p-3.5">Kategori</th>
                                                    <th className="p-3.5">Nilai Pembelian</th>
                                                    <th className="p-3.5">Kondisi</th>
                                                    <th className="p-3.5 rounded-r-xl">Lokasi</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {assets.map(a => (
                                                    <tr key={a.id} className="border-b border-slate-100 hover:bg-emerald-50/30">
                                                        <td className="p-3.5 font-bold text-slate-900">{a.nama_aset}</td>
                                                        <td className="p-3.5">{a.kategori}</td>
                                                        <td className="p-3.5 font-semibold">Rp {(a.nilai_pembelian || 0).toLocaleString()}</td>
                                                        <td className="p-3.5"><span className="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-xl text-xs font-bold">{a.kondisi || 'Baik'}</span></td>
                                                        <td className="p-3.5">{a.lokasi || '-'}</td>
                                                    </tr>
                                                ))}
                                                {assets.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-slate-400">Belum ada data aset tercatat.</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'audit' && (
                                <div className="bg-white/90 backdrop-blur-sm rounded-3xl shadow-sm border border-emerald-100 p-6">
                                    <h3 className="text-lg font-black text-darker mb-4">Audit Log Aktivitas Sistem</h3>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm text-slate-600">
                                            <thead className="bg-emerald-50/70 text-darker font-bold border-b border-emerald-100 text-xs uppercase tracking-wider">
                                                <tr>
                                                    <th className="p-3.5 rounded-l-xl">Waktu</th>
                                                    <th className="p-3.5">Aksi</th>
                                                    <th className="p-3.5">Pelaku</th>
                                                    <th className="p-3.5 rounded-r-xl">Detail</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {auditLogs.map(l => (
                                                    <tr key={l.id} className="border-b border-slate-100 hover:bg-emerald-50/30">
                                                        <td className="p-3.5 text-slate-500">{l.waktu}</td>
                                                        <td className="p-3.5 font-bold text-primary">{l.aksi}</td>
                                                        <td className="p-3.5 font-semibold">{l.pelaku}</td>
                                                        <td className="p-3.5">{l.detail}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'backup' && (
                                <div className="bg-white/90 backdrop-blur-sm rounded-3xl shadow-sm border border-emerald-100 p-6 max-w-xl">
                                    <h3 className="text-lg font-black text-darker mb-2">Backup Database</h3>
                                    <p className="text-xs text-slate-500 mb-6">Unduh salinan cadangan database SQLite untuk keamanan data lingkungan.</p>
                                    <a href="/api/admin/backup" className="inline-flex items-center space-x-2 px-6 py-3 bg-primary hover:bg-darker text-white font-bold rounded-2xl shadow-md transition text-sm">
                                        <i className="fa-solid fa-download"></i><span>Download Backup SQLite</span>
                                    </a>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* MODAL INPUT WARGA */}
                    {showModalWarga && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-emerald-100">
                                <h3 className="text-lg font-black text-darker mb-4">Input Data Warga Baru</h3>
                                <form onSubmit={handleSaveWarga} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">Nama Warga</label>
