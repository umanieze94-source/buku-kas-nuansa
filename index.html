<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUKU KAS & TABUNGAN WARGA NUANSA16A</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [loginMode, setLoginMode] = useState('ADMIN'); 
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [noHpLeader, setNoHpLeader] = useState('');
      const [noHpWarga, setNoHpWarga] = useState('');
      const [otpCode, setOtpCode] = useState('');
      const [otpSent, setOtpSent] = useState(false);
      const [devOtpMsg, setDevOtpMsg] = useState('');

      const [loggedInUser, setLoggedInUser] = useState(null);
      const [errorMsg, setErrorMsg] = useState('');
      const [successMsg, setSuccessMsg] = useState('');
      const [activeMenu, setActiveMenu] = useState('Dashboard');

      const [dashboardMeta, setDashboardMeta] = useState({
        judul: 'Ringkasan Aktivitas Keuangan Real-Time',
        deskripsi: 'Sistem otomatis terintegrasi dengan pencatatan iuran warga dan kas gang.'
      });

      const [leaders, setLeaders] = useState([]);
      const [members, setMembers] = useState([]);
      const [iuranList, setIuranList] = useState([]);
      const [kasGangList, setKasGangList] = useState([]);
      const [corJalanList, setCorJalanList] = useState([]);
      const [jimpitanList, setJimpitanList] = useState([]);
      const [ibuIbuList, setIbuIbuList] = useState([]);
      const [tunggakanList, setTunggakanList] = useState([]);

      const [formLeader, setFormLeader] = useState({ id: null, nama: '', jabatan: '', no_hp: '' });
      const [formMember, setFormMember] = useState({ id: null, nik: '', nama: '', alamat: '', no_hp: '', kategori: 'Warga Tetap' });
      const [formIuran, setFormIuran] = useState({ warga_id: '', bulan: 'Januari', tahun: '2026', nominal: 0, keterangan: 'Iuran Bulanan' });
      const [formKas, setFormKas] = useState({ id: null, tanggal: '', uraian: '', masuk: 0, keluar: 0 });

      useEffect(() => {
        if (loggedInUser) fetchAllData();
      }, [loggedInUser]);

      useEffect(() => {
        if (loggedInUser) fetchData(activeMenu);
      }, [activeMenu]);

      const fetchAllData = async () => {
        try {
          const [resKas, resCor, resJim, resIbu, resMem, resLead, resTung, resIur] = await Promise.all([
            fetch('/api/kas-gang').then(res => res.json()),
            fetch('/api/cor-jalan').then(res => res.json()),
            fetch('/api/jimpitan').then(res => res.json()),
            fetch('/api/ibu-ibu').then(res => res.json()),
            fetch('/api/members').then(res => res.json()),
            fetch('/api/leaders').then(res => res.json()),
            fetch('/api/tunggakan').then(res => res.json()),
            fetch('/api/iuran').then(res => res.json())
          ]);

          if (resKas.success) setKasGangList(resKas.data);
          if (resCor.success) setCorJalanList(resCor.data);
          if (resJim.success) setJimpitanList(resJim.data);
          if (resIbu.success) setIbuIbuList(resIbu.data);
          if (resMem.success) setMembers(resMem.data);
          if (resLead.success) setLeaders(resLead.data);
          if (resTung.success) setTunggakanList(resTung.data);
          if (resIur.success) setIuranList(resIur.data);
        } catch (err) {
          console.error("Gagal sinkronisasi data:", err);
        }
      };

      const fetchData = async (menu) => {
        if (menu === 'Data Pengurus') {
          const res = await fetch('/api/leaders').then(r => r.json());
          if (res.success) setLeaders(res.data);
        } else if (menu === 'Data Warga') {
          const [resMem, resIur] = await Promise.all([
            fetch('/api/members').then(r => r.json()),
            fetch('/api/iuran').then(r => r.json())
          ]);
          if (resMem.success) setMembers(resMem.data);
          if (resIur.success) setIuranList(resIur.data);
        } else if (menu === 'Kas Gang') {
          const res = await fetch('/api/kas-gang').then(r => r.json());
          if (res.success) setKasGangList(res.data);
        } else if (menu === 'Cor Jalan') {
          const res = await fetch('/api/cor-jalan').then(r => r.json());
          if (res.success) setCorJalanList(res.data);
        } else if (menu === 'Jimpitan') {
          const res = await fetch('/api/jimpitan').then(r => r.json());
          if (res.success) setJimpitanList(res.data);
        } else if (menu === 'Keuangan Ibu Ibu') {
          const res = await fetch('/api/ibu-ibu').then(r => r.json());
          if (res.success) setIbuIbuList(res.data);
        } else if (menu === 'Tunggakan') {
          const res = await fetch('/api/tunggakan').then(r => r.json());
          if (res.success) setTunggakanList(res.data);
        }
      };

      const hitungSaldo = (list) => {
        return list.reduce((total, item) => {
          const masuk = Number(item.masuk || item.nominal || 0);
          const keluar = Number(item.keluar || 0);
          return total + (masuk - keluar);
        }, 0);
      };

      const totalKasGang = hitungSaldo(kasGangList);
      const totalCorJalan = hitungSaldo(corJalanList);
      const totalJimpitan = hitungSaldo(jimpitanList);
      const totalIbuIbu = hitungSaldo(ibuIbuList);

      const handleLoginAdmin = async (e) => {
        e.preventDefault();
        setErrorMsg(''); setSuccessMsg('');
        const res = await fetch('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        }).then(r => r.json());
        if (!res.success) return setErrorMsg(res.message);
        setLoggedInUser(res.user);
      };

      const handleRequestOtp = async (e, type) => {
        e.preventDefault();
        setErrorMsg(''); setSuccessMsg(''); setDevOtpMsg('');
        const endpoint = type === 'LEADER' ? '/api/leader/request-otp' : '/api/warga/request-otp';
        const noHp = type === 'LEADER' ? noHpLeader : noHpWarga;

        const res = await fetch(endpoint, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ no_hp: noHp })
        }).then(r => r.json());

        if (!res.success) return setErrorMsg(res.message);
        setOtpSent(true);
        setSuccessMsg(res.message);
        if (res.dev_otp) setDevOtpMsg(`[KODE OTP PENGUJIAN]: ${res.dev_otp}`);
      };

      const handleVerifyOtp = async (e, type) => {
        e.preventDefault();
        const endpoint = type === 'LEADER' ? '/api/leader/verify-otp' : '/api/warga/verify-otp';
        const noHp = type === 'LEADER' ? noHpLeader : noHpWarga;

        const res = await fetch(endpoint, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ no_hp: noHp, otp: otpCode })
        }).then(r => r.json());

        if (!res.success) return setErrorMsg(res.message);
        setLoggedInUser(res.user);
      };

      const handleSaveLeader = async (e) => {
        e.preventDefault();
        const url = formLeader.id ? `/api/leaders/${formLeader.id}` : '/api/leaders';
        await fetch(url, {
          method: formLeader.id ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formLeader)
        }).then(() => { setFormLeader({ id: null, nama: '', jabatan: '', no_hp: '' }); fetchData('Data Pengurus'); });
      };

      const handleSaveMember = async (e) => {
        e.preventDefault();
        const url = formMember.id ? `/api/members/${formMember.id}` : '/api/members';
        await fetch(url, {
          method: formMember.id ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formMember)
        }).then(() => { setFormMember({ id: null, nik: '', nama: '', alamat: '', no_hp: '', kategori: 'Warga Tetap' }); fetchData('Data Warga'); });
      };

      const handleSaveIuran = async (e) => {
        e.preventDefault();
        await fetch('/api/iuran', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...formIuran, input_oleh: loggedInUser.nama })
        }).then(() => {
          setFormIuran({ warga_id: '', bulan: 'Januari', tahun: '2026', nominal: 0, keterangan: 'Iuran Bulanan' });
          fetchAllData();
          fetchData('Data Warga');
        });
      };

      const handleSaveKas = async (e, routeName) => {
        e.preventDefault();
        const url = formKas.id ? `/api/${routeName}/${formKas.id}` : `/api/${routeName}`;
        await fetch(url, {
          method: formKas.id ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...formKas, input_oleh: loggedInUser.nama })
        }).then(() => {
          setFormKas({ id: null, tanggal: '', uraian: '', masuk: 0, keluar: 0 });
          fetchAllData();
          fetchData(activeMenu);
        });
      };

      // Fungsi khusus Admin untuk Revisi / Hapus Data Salah Input
      const handleRevisiHapus = async (id, routeName) => {
        if (confirm(`ADMIN REVISI: Yakin ingin menghapus data dari ${routeName}? Transaksi ini akan dibatalkan.`)) {
          await fetch(`/api/${routeName}/${id}`, { method: 'DELETE' });
          fetchAllData();
        }
      };

      const isAdmin = loggedInUser?.role === 'SUPER_ADMIN' || loggedInUser?.role === 'ADMIN';
      const isWarga = loggedInUser?.role === 'WARGA';

      // Daftar Menu Navigasi (Menu Revisi Hanya Ditampilkan Jika Admin Login)
      const menuList = ['Dashboard', 'Kas Gang', 'Cor Jalan', 'Jimpitan', 'Keuangan Ibu Ibu', 'Data Warga', 'Data Pengurus', 'Tunggakan'];
      if (isAdmin) menuList.push('Revisi');

      if (loggedInUser) {
        return (
          <div className="min-h-screen bg-slate-100 flex">
            {/* Sidebar */}
            <div className="w-64 bg-emerald-900 text-white flex flex-col shadow-xl">
              <div className="p-5 bg-emerald-950 text-center border-b border-emerald-800">
                <h1 className="font-bold text-lg tracking-wider">NUANSA16A</h1>
                <p className="text-xs text-emerald-300 mt-1">Buku Kas & Tabungan Warga</p>
              </div>
              <nav className="flex-1 p-4 space-y-1 overflow-y-auto text-sm">
                {menuList.map((menu) => (
                  <button
                    key={menu}
                    onClick={() => setActiveMenu(menu)}
                    className={`w-full text-left px-4 py-2.5 rounded-lg transition font-medium ${activeMenu === menu ? (menu === 'Revisi' ? 'bg-rose-700 text-white shadow-md' : 'bg-emerald-700 text-white shadow-md') : 'text-emerald-100 hover:bg-emerald-800'}`}
                  >
                    {menu === 'Revisi' ? '⚠️ Revisi Admin' : menu}
                  </button>
                ))}
              </nav>
              <div className="p-4 border-t border-emerald-800">
                <button onClick={() => setLoggedInUser(null)} className="w-full bg-rose-600 hover:bg-rose-700 text-white font-medium px-4 py-2 rounded-lg transition text-sm shadow">
                  Keluar Sistem
                </button>
              </div>
            </div>

            {/* Main Content */}
            <div className="flex-1 flex flex-col overflow-hidden">
              <header className="bg-white shadow-sm h-16 flex items-center justify-between px-8 border-b border-slate-200">
                <h2 className="text-xl font-bold text-emerald-800">{activeMenu}</h2>
                <div className="text-sm text-slate-600">
                  Login sebagai: <strong className="text-emerald-700">{loggedInUser.nama}</strong> ({loggedInUser.role})
                </div>
              </header>

              <main className="flex-1 overflow-y-auto p-8">
                {/* DASHBOARD */}
                {activeMenu === 'Dashboard' && (
                  <div className="space-y-6">
                    <div className="flex justify-between items-center">
                      <h3 className="text-lg font-bold text-slate-700">Ringkasan Saldo Otomatis</h3>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                      <div className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-emerald-600">
                        <p className="text-xs text-slate-500 uppercase font-semibold">Total Saldo Kas Gang</p>
                        <h3 className="text-2xl font-bold text-slate-800 mt-2">Rp {totalKasGang.toLocaleString('id-ID')}</h3>
                      </div>
                      <div className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-emerald-600">
                        <p className="text-xs text-slate-500 uppercase font-semibold">Total Saldo Cor Jalan</p>
                        <h3 className="text-2xl font-bold text-slate-800 mt-2">Rp {totalCorJalan.toLocaleString('id-ID')}</h3>
                      </div>
                      <div className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-emerald-600">
                        <p className="text-xs text-slate-500 uppercase font-semibold">Total Saldo Jimpitan</p>
                        <h3 className="text-2xl font-bold text-slate-800 mt-2">Rp {totalJimpitan.toLocaleString('id-ID')}</h3>
                      </div>
                      <div className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-emerald-600">
                        <p className="text-xs text-slate-500 uppercase font-semibold">Total Saldo Ibu Ibu</p>
                        <h3 className="text-2xl font-bold text-slate-800 mt-2">Rp {totalIbuIbu.toLocaleString('id-ID')}</h3>
                      </div>
                    </div>
                  </div>
                )}

                {/* MENU KHUSUS REVISI ADMIN */}
                {activeMenu === 'Revisi' && isAdmin && (
                  <div className="space-y-6">
                    <div className="bg-rose-50 border border-rose-200 p-4 rounded-xl text-rose-800 text-sm">
                      <strong>Pusat Koreksi Data Admin:</strong> Di halaman ini Anda dapat menghapus atau meralat transaksi yang salah input oleh pengurus dari semua modul.
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm space-y-4">
                      <h3 className="font-bold text-slate-700">Revisi Transaksi Kas Gang</h3>
                      <table className="w-full text-left text-sm border-collapse">
                        <thead>
                          <tr className="border-b bg-slate-50">
                            <th className="p-2">Tanggal</th>
                            <th className="p-2">Uraian</th>
                            <th className="p-2">Masuk</th>
                            <th className="p-2">Keluar</th>
                            <th className="p-2">Penginput</th>
                            <th className="p-2 text-right">Aksi Hapus</th>
                          </tr>
                        </thead>
                        <tbody>
                          {kasGangList.map(item => (
                            <tr key={item.id} className="border-b hover:bg-slate-50">
                              <td className="p-2">{item.tanggal}</td>
                              <td className="p-2">{item.uraian}</td>
                              <td className="p-2 text-emerald-600">Rp {(item.masuk || 0).toLocaleString('id-ID')}</td>
                              <td className="p-2 text-rose-600">Rp {(item.keluar || 0).toLocaleString('id-ID')}</td>
                              <td className="p-2">{item.input_oleh}</td>
                              <td className="p-2 text-right">
                                <button onClick={() => handleRevisiHapus(item.id, 'kas-gang')} className="bg-rose-600 text-white px-3 py-1 rounded text-xs hover:bg-rose-700">Hapus Transaksi</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm space-y-4">
                      <h3 className="font-bold text-slate-700">Revisi Transaksi Cor Jalan</h3>
                      <table className="w-full text-left text-sm border-collapse">
                        <thead>
                          <tr className="border-b bg-slate-50">
                            <th className="p-2">Tanggal</th>
                            <th className="p-2">Uraian</th>
                            <th className="p-2">Masuk</th>
                            <th className="p-2">Keluar</th>
                            <th className="p-2 text-right">Aksi Hapus</th>
                          </tr>
                        </thead>
                        <tbody>
                          {corJalanList.map(item => (
                            <tr key={item.id} className="border-b hover:bg-slate-50">
                              <td className="p-2">{item.tanggal}</td>
                              <td className="p-2">{item.uraian}</td>
                              <td className="p-2 text-emerald-600">Rp {(item.masuk || 0).toLocaleString('id-ID')}</td>
                              <td className="p-2 text-rose-600">Rp {(item.keluar || 0).toLocaleString('id-ID')}</td>
                              <td className="p-2 text-right">
                                <button onClick={() => handleRevisiHapus(item.id, 'cor-jalan')} className="bg-rose-600 text-white px-3 py-1 rounded text-xs hover:bg-rose-700">Hapus Transaksi</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm space-y-4">
                      <h3 className="font-bold text-slate-700">Revisi Transaksi Keuangan Ibu Ibu</h3>
                      <table className="w-full text-left text-sm border-collapse">
                        <thead>
                          <tr className="border-b bg-slate-50">
                            <th className="p-2">Tanggal</th>
                            <th className="p-2">Uraian</th>
                            <th className="p-2">Masuk</th>
                            <th className="p-2">Keluar</th>
                            <th className="p-2 text-right">Aksi Hapus</th>
                          </tr>
                        </thead>
                        <tbody>
                          {ibuIbuList.map(item => (
                            <tr key={item.id} className="border-b hover:bg-slate-50">
                              <td className="p-2">{item.tanggal}</td>
                              <td className="p-2">{item.uraian}</td>
                              <td className="p-2 text-emerald-600">Rp {(item.masuk || 0).toLocaleString('id-ID')}</td>
                              <td className="p-2 text-rose-600">Rp {(item.keluar || 0).toLocaleString('id-ID')}</td>
                              <td className="p-2 text-right">
                                <button onClick={() => handleRevisiHapus(item.id, 'ibu-ibu')} className="bg-rose-600 text-white px-3 py-1 rounded text-xs hover:bg-rose-700">Hapus Transaksi</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* MODUL KAS UMUM */}
                {['Kas Gang', 'Cor Jalan', 'Keuangan Ibu Ibu'].includes(activeMenu) && (
                  <div className="space-y-6">
                    {!isWarga && (
                      <div className="bg-white p-6 rounded-xl shadow-sm">
                        <h3 className="font-bold text-slate-700 mb-4">Input Transaksi {activeMenu}</h3>
                        <form onSubmit={(e) => handleSaveKas(e, activeMenu === 'Keuangan Ibu Ibu' ? 'ibu-ibu' : activeMenu.toLowerCase().replace(' ', '-'))} className="grid grid-cols-1 md:grid-cols-5 gap-4">
                          <input type="date" value={formKas.tanggal} onChange={e => setFormKas({ ...formKas, tanggal: e.target.value })} className="border p-2 rounded" required />
                          <input type="text" placeholder="Uraian" value={formKas.uraian} onChange={e => setFormKas({ ...formKas, uraian: e.target.value })} className="border p-2 rounded" required />
                          <input type="number" placeholder="Masuk (Rp)" value={formKas.masuk} onChange={e => setFormKas({ ...formKas, masuk: Number(e.target.value) })} className="border p-2 rounded" />
                          <input type="number" placeholder="Keluar (Pengeluaran)" value={formKas.keluar} onChange={e => setFormKas({ ...formKas, keluar: Number(e.target.value) })} className="border p-2 rounded" />
                          <button type="submit" className="bg-emerald-600 text-white rounded p-2 hover:bg-emerald-700">Simpan Transaksi</button>
                        </form>
                      </div>
                    )}

                    <div className="bg-white p-6 rounded-xl shadow-sm overflow-x-auto">
                      <table className="w-full text-left text-sm border-collapse">
                        <thead>
                          <tr className="border-b bg-slate-50">
                            <th className="p-3">Tanggal</th>
                            <th className="p-3">Uraian</th>
                            <th className="p-3 text-emerald-600">Masuk</th>
                            <th className="p-3 text-rose-600">Keluar</th>
                            <th className="p-3">Penginput</th>
                          </tr>
                        </thead>
                        <tbody>
                          {(activeMenu === 'Kas Gang' ? kasGangList : activeMenu === 'Cor Jalan' ? corJalanList : ibuIbuList).map(item => (
                            <tr key={item.id} className="border-b hover:bg-slate-50">
                              <td className="p-3">{item.tanggal}</td>
                              <td className="p-3 font-medium">{item.uraian}</td>
                              <td className="p-3 text-emerald-600">Rp {(item.masuk || 0).toLocaleString('id-ID')}</td>
                              <td className="p-3 text-rose-600 font-bold">Rp {(item.keluar || 0).toLocaleString('id-ID')}</td>
                              <td className="p-3 text-slate-500">{item.input_oleh || 'Sistem'}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* DATA WARGA & DATA PENGURUS */}
                {activeMenu === 'Data Warga' && (
                  <div className="space-y-6">
                    {!isWarga && (
                      <div className="bg-emerald-50 border border-emerald-200 p-6 rounded-xl shadow-sm">
                        <h3 className="font-bold text-emerald-800 mb-4">Input Iuran Bulanan Warga</h3>
                        <form onSubmit={handleSaveIuran} className="grid grid-cols-1 md:grid-cols-5 gap-4">
                          <select value={formIuran.warga_id} onChange={e => setFormIuran({ ...formIuran, warga_id: e.target.value })} className="border p-2 rounded" required>
                            <option value="">-- Pilih Warga --</option>
                            {members.map(w => <option key={w.id} value={w.id}>{w.nama} ({w.alamat})</option>)}
                          </select>
                          <select value={formIuran.bulan} onChange={e => setFormIuran({ ...formIuran, bulan: e.target.value })} className="border p-2 rounded">
                            {['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'].map(b => <option key={b} value={b}>{b}</option>)}
                          </select>
                          <input type="text" value={formIuran.tahun} onChange={e => setFormIuran({ ...formIuran, tahun: e.target.value })} className="border p-2 rounded" placeholder="Tahun" required />
                          <input type="number" placeholder="Nominal" value={formIuran.nominal} onChange={e => setFormIuran({ ...formIuran, nominal: Number(e.target.value) })} className="border p-2 rounded" required />
                          <button type="submit" className="bg-emerald-600 text-white rounded p-2 hover:bg-emerald-700">Simpan Iuran</button>
                        </form>
                      </div>
                    )}

                    <div className="bg-white p-6 rounded-xl shadow-sm overflow-x-auto">
                      <h3 className="font-bold text-slate-700 mb-3">Daftar Warga & Log Iuran Bulanan</h3>
                      <table className="w-full text-left text-sm border-collapse">
                        <thead>
                          <tr className="border-b bg-slate-50">
                            <th className="p-3">Nama Warga</th>
                            <th className="p-3">Bulan / Tahun</th>
                            <th className="p-3 text-emerald-600">Nominal</th>
                            <th className="p-3">Input Oleh</th>
                          </tr>
                        </thead>
                        <tbody>
                          {iuranList.map(i => (
                            <tr key={i.id} className="border-b hover:bg-slate-50">
                              <td className="p-3 font-medium">{i.nama_warga}</td>
                              <td className="p-3">{i.bulan} {i.tahun}</td>
                              <td className="p-3 text-emerald-600 font-bold">Rp {(i.nominal || 0).toLocaleString('id-ID')}</td>
                              <td className="p-3 text-slate-500">{i.input_oleh}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </main>
            </div>
          </div>
        );
      }

      // LOGIN PAGE
      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="bg-white max-w-md w-full rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
            <div className="bg-emerald-700 p-6 text-white text-center">
              <h2 className="text-xl font-bold tracking-wide">BUKU KAS & TABUNGAN WARGA</h2>
              <p className="text-emerald-100 text-sm mt-1">NUANSA16A C3/C8</p>

              <div className="grid grid-cols-3 gap-1 bg-emerald-800 rounded-lg p-1 mt-4 text-xs font-semibold">
                <button onClick={() => { setLoginMode('ADMIN'); setErrorMsg(''); setSuccessMsg(''); }} className={`py-1.5 rounded-md ${loginMode === 'ADMIN' ? 'bg-white text-emerald-900 shadow' : 'text-emerald-200'}`}>Admin</button>
                <button onClick={() => { setLoginMode('LEADER_OTP'); setErrorMsg(''); setSuccessMsg(''); }} className={`py-1.5 rounded-md ${loginMode === 'LEADER_OTP' ? 'bg-white text-emerald-900 shadow' : 'text-emerald-200'}`}>Pengurus</button>
                <button onClick={() => { setLoginMode('WARGA_OTP'); setErrorMsg(''); setSuccessMsg(''); }} className={`py-1.5 rounded-md ${loginMode === 'WARGA_OTP' ? 'bg-white text-emerald-900 shadow' : 'text-emerald-200'}`}>Warga</button>
              </div>
            </div>

            <div className="p-6">
              {errorMsg && <div className="mb-4 bg-rose-100 border border-rose-300 text-rose-700 px-4 py-3 rounded-lg text-sm">{errorMsg}</div>}
              {successMsg && <div className="mb-4 bg-amber-100 border border-amber-300 text-amber-800 px-4 py-3 rounded-lg text-sm">{successMsg}</div>}
              {devOtpMsg && <div className="mb-4 bg-emerald-100 border border-emerald-300 text-emerald-800 px-4 py-2 rounded-lg text-xs font-mono">{devOtpMsg}</div>}

              {loginMode === 'ADMIN' && (
                <form onSubmit={handleLoginAdmin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Username Admin</label>
                    <input type="text" value={username} onChange={e => setUsername(e.target.value)} className="w-full px-4 py-2 border rounded-lg" required />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                    <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full px-4 py-2 border rounded-lg" required />
                  </div>
                  <button type="submit" className="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg">Masuk Admin</button>
                </form>
              )}

              {loginMode === 'LEADER_OTP' && (
                <div className="space-y-4">
                  {!otpSent ? (
                    <form onSubmit={(e) => handleRequestOtp(e, 'LEADER')} className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nomor HP Pengurus</label>
                        <input type="text" value={noHpLeader} onChange={e => setNoHpLeader(e.target.value)} className="w-full px-4 py-2 border rounded-lg" placeholder="08..." required />
                      </div>
                      <button type="submit" className="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg">Kirim OTP Pengurus</button>
                    </form>
                  ) : (
                    <form onSubmit={(e) => handleVerifyOtp(e, 'LEADER')} className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Kode OTP 4 Digit</label>
                        <input type="text" value={otpCode} onChange={e => setOtpCode(e.target.value)} className="w-full px-4 py-2 border text-center font-mono text-xl tracking-widest rounded-lg" maxLength="4" required />
                      </div>
                      <button type="submit" className="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg">Verifikasi & Masuk</button>
                    </form>
                  )}
                </div>
              )}

              {loginMode === 'WARGA_OTP' && (
                <div className="space-y-4">
                  {!otpSent ? (
                    <form onSubmit={(e) => handleRequestOtp(e, 'WARGA')} className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nomor HP Warga</label>
                        <input type="text" value={noHpWarga} onChange={e => setNoHpWarga(e.target.value)} className="w-full px-4 py-2 border rounded-lg" placeholder="08..." required />
                      </div>
                      <button type="submit" className="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg">Kirim OTP Warga</button>
                    </form>
                  ) : (
                    <form onSubmit={(e) => handleVerifyOtp(e, 'WARGA')} className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Kode OTP 4 Digit</label>
                        <input type="text" value={otpCode} onChange={e => setOtpCode(e.target.value)} className="w-full px-4 py-2 border text-center font-mono text-xl tracking-widest rounded-lg" maxLength="4" required />
                      </div>
                      <button type="submit" className="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg">Verifikasi & Masuk</button>
                    </form>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
