<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUKU KAS & TABUNGAN WARGA NUANSA16A</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .bg-app-pattern {
      background-image: linear-gradient(rgba(248, 250, 252, 0.93), rgba(248, 250, 252, 0.93)), url('https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [loginMode, setLoginMode] = useState('ADMIN'); 
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [noHpLeader, setNoHpLeader] = useState('');
      const [noHpWarga, setNoHpWarga] = useState('');
      const [otpCode, setOtpCode] = useState('');
      const [otpSent, setOtpSent] = useState(false);
      const [devOtpMsg, setDevOtpMsg] = useState('');

      const [loggedInUser, setLoggedInUser] = useState(null);
      const [errorMsg, setErrorMsg] = useState('');
      const [successMsg, setSuccessMsg] = useState('');
      const [activeMenu, setActiveMenu] = useState('Dashboard');
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);

      const [leaders, setLeaders] = useState([]);
      const [members, setMembers] = useState([]);
      const [iuranList, setIuranList] = useState([]);
      const [kasGangList, setKasGangList] = useState([]);
      const [corJalanList, setCorJalanList] = useState([]);
      const [jimpitanList, setJimpitanList] = useState([]);
      const [ibuIbuList, setIbuIbuList] = useState([]);

      const [formMember, setFormMember] = useState({ id: null, nik: '', nama: '', alamat: '', no_hp: '', kategori: 'Warga Tetap' });
      const [formLeader, setFormLeader] = useState({ id: null, nama: '', jabatan: '', no_hp: '', pic_modul: 'Kas Gang' });
      const [formIuran, setFormIuran] = useState({ warga_id: '', bulan: 'Januari', tahun: '2026', nominal: 0, keterangan: 'Iuran Bulanan' });
      const [formKas, setFormKas] = useState({ id: null, tanggal: '', uraian: '', nama_warga: '', masuk: 0, keluar: 0 });

      useEffect(() => {
        if (loggedInUser) fetchAllData();
      }, [loggedInUser]);

      useEffect(() => {
        if (loggedInUser) fetchData(activeMenu);
      }, [activeMenu]);

      const fetchAllData = async () => {
        try {
          const [resKas, resCor, resJim, resIbu, resMem, resLead, resIur] = await Promise.all([
            fetch('/api/kas-gang').then(res => res.json()),
            fetch('/api/cor-jalan').then(res => res.json()),
            fetch('/api/jimpitan').then(res => res.json()),
            fetch('/api/ibu-ibu').then(res => res.json()),
            fetch('/api/members').then(res => res.json()),
            fetch('/api/leaders').then(res => res.json()),
            fetch('/api/iuran').then(res => res.json())
          ]);

          if (resKas.success) setKasGangList(resKas.data);
          if (resCor.success) setCorJalanList(resCor.data);
          if (resJim.success) setJimpitanList(resJim.data);
          if (resIbu.success) setIbuIbuList(resIbu.data);
          if (resMem.success) setMembers(resMem.data);
          if (resLead.success) setLeaders(resLead.data);
          if (resIur.success) setIuranList(resIur.data);
        } catch (err) {
          console.error("Gagal sinkronisasi data:", err);
        }
      };

      const fetchData = async (menu) => {
        if (menu === 'Data Warga') {
          const [resMem, resIur] = await Promise.all([
            fetch('/api/members').then(r => r.json()),
            fetch('/api/iuran').then(r => r.json())
          ]);
          if (resMem.success) setMembers(resMem.data);
          if (resIur.success) setIuranList(resIur.data);
        } else if (menu === 'Data Pengurus') {
          const res = await fetch('/api/leaders').then(r => r.json());
          if (res.success) setLeaders(res.data);
        } else if (menu === 'Kas Gang') {
          const res = await fetch('/api/kas-gang').then(r => r.json());
          if (res.success) setKasGangList(res.data);
        } else if (menu === 'Cor Jalan') {
          const res = await fetch('/api/cor-jalan').then(r => r.json());
          if (res.success) setCorJalanList(res.data);
        } else if (menu === 'Jimpitan') {
          const res = await fetch('/api/jimpitan').then(r => r.json());
          if (res.success) setJimpitanList(res.data);
        } else if (menu === 'Keuangan Ibu Ibu') {
          const res = await fetch('/api/ibu-ibu').then(r => r.json());
          if (res.success) setIbuIbuList(res.data);
        }
      };

      const hitungSaldo = (list) => {
        return list.reduce((total, item) => {
          const masuk = Number(item.masuk || item.nominal || 0);
          const keluar = Number(item.keluar || 0);
          return total + (masuk - keluar);
        }, 0);
      };

      const totalKasGang = hitungSaldo(kasGangList);
      const totalCorJalan = hitungSaldo(corJalanList);
      const totalJimpitan = hitungSaldo(jimpitanList);
      const totalIbuIbu = hitungSaldo(ibuIbuList);

      const handleLoginAdmin = async (e) => {
        e.preventDefault();
        setErrorMsg(''); setSuccessMsg('');
        const res = await fetch('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        }).then(r => r.json());
        if (!res.success) return setErrorMsg(res.message);
        setLoggedInUser(res.user);
      };

      const handleRequestOtp = async (e, type) => {
        e.preventDefault();
        setErrorMsg(''); setSuccessMsg(''); setDevOtpMsg('');
        const endpoint = type === 'LEADER' ? '/api/leader/request-otp' : '/api/warga/request-otp';
        const noHp = type === 'LEADER' ? noHpLeader : noHpWarga;

        const res = await fetch(endpoint, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ no_hp: noHp })
        }).then(r => r.json());

        if (!res.success) return setErrorMsg(res.message);
        setOtpSent(true);
        setSuccessMsg(res.message);
        if (res.dev_otp) setDevOtpMsg(`[KODE OTP PENGUJIAN]: ${res.dev_otp}`);
      };

      const handleVerifyOtp = async (e, type) => {
        e.preventDefault();
        const endpoint = type === 'LEADER' ? '/api/leader/verify-otp' : '/api/warga/verify-otp';
        const noHp = type === 'LEADER' ? noHpLeader : noHpWarga;

        const res = await fetch(endpoint, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ no_hp: noHp, otp: otpCode })
        }).then(r => r.json());

        if (!res.success) return setErrorMsg(res.message);
        setLoggedInUser(res.user);
      };

      const handleSaveMember = async (e) => {
        e.preventDefault();
        const url = formMember.id ? `/api/members/${formMember.id}` : '/api/members';
        await fetch(url, {
          method: formMember.id ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formMember)
        }).then(() => { 
          setFormMember({ id: null, nik: '', nama: '', alamat: '', no_hp: '', kategori: 'Warga Tetap' }); 
          fetchAllData();
          fetchData('Data Warga'); 
        });
      };

      const handleDeleteMember = async (id) => {
        if (confirm('Yakin ingin menghapus data warga ini?')) {
          await fetch(`/api/members/${id}`, { method: 'DELETE' }).then(() => { fetchAllData(); fetchData('Data Warga'); });
        }
      };

      const handleSaveLeader = async (e) => {
        e.preventDefault();
        const url = formLeader.id ? `/api/leaders/${formLeader.id}` : '/api/leaders';
        await fetch(url, {
          method: formLeader.id ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formLeader)
        }).then(() => {
          setFormLeader({ id: null, nama: '', jabatan: '', no_hp: '', pic_modul: 'Kas Gang' });
          fetchAllData();
          fetchData('Data Pengurus');
        });
      };

      const handleDeleteLeader = async (id) => {
        if (confirm('Yakin ingin menghapus data pengurus ini?')) {
          await fetch(`/api/leaders/${id}`, { method: 'DELETE' }).then(() => { fetchAllData(); fetchData('Data Pengurus'); });
        }
      };

      const handleSaveIuran = async (e) => {
        e.preventDefault();
        await fetch('/api/iuran', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...formIuran, input_oleh: loggedInUser.nama })
        }).then(() => {
          setFormIuran({ warga_id: '', bulan: 'Januari', tahun: '2026', nominal: 0, keterangan: 'Iuran Bulanan' });
          fetchAllData();
          fetchData('Data Warga');
        });
      };

      const handleSaveKas = async (e, routeName) => {
        e.preventDefault();
        const url = formKas.id ? `/api/${routeName}/${formKas.id}` : `/api/${routeName}`;
        await fetch(url, {
          method: formKas.id ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...formKas, input_oleh: loggedInUser.nama })
        }).then(() => {
          setFormKas({ id: null, tanggal: '', uraian: '', nama_warga: '', masuk: 0, keluar: 0 });
          fetchAllData();
          fetchData(activeMenu);
        });
      };

      const handleRevisiHapus = async (id, routeName) => {
        if (confirm(`ADMIN REVISI: Yakin ingin menghapus data dari ${routeName}?`)) {
          await fetch(`/api/${routeName}/${id}`, { method: 'DELETE' });
          fetchAllData();
        }
      };

      const isAdmin = loggedInUser?.role === 'SUPER_ADMIN' || loggedInUser?.role === 'ADMIN';
      const isWarga = loggedInUser?.role === 'WARGA';

      const menuList = ['Dashboard', 'Kas Gang', 'Cor Jalan', 'Jimpitan', 'Keuangan Ibu Ibu', 'Data Warga', 'Data Pengurus'];
      if (isAdmin) menuList.push('Revisi');

      if (loggedInUser) {
        return (
          <div className="min-h-screen bg-slate-100 flex flex-col md:flex-row relative bg-app-pattern">
            {/* Tombol Hamburger Mobile */}
            <div className="md:hidden bg-emerald-900 text-white p-4 flex justify-between items-center shadow-md z-20">
              <div className="flex items-center space-x-3">
                <div className="w-8 h-8 rounded-full bg-emerald-800 border border-emerald-400 flex items-center justify-center font-bold text-xs text-emerald-300">16A</div>
                <h1 className="font-bold text-sm tracking-wider">NUANSA16A</h1>
              </div>
              <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="bg-emerald-800 p-2 rounded-lg text-white text-sm">
                {isSidebarOpen ? '✕ Tutup Menu' : '☰ Menu'}
              </button>
            </div>

            {/* Sidebar Terintegrasi */}
            <div className={`${isSidebarOpen ? 'block' : 'hidden'} md:block w-full md:w-64 bg-emerald-900 text-white flex flex-col shadow-xl z-30 fixed md:static inset-y-0 left-0 transition-all duration-300`}>
              <div className="p-5 bg-emerald-950 text-center border-b border-emerald-800 flex flex-col items-center">
                <div className="w-16 h-16 rounded-full bg-emerald-800 border-2 border-emerald-400 overflow-hidden mb-2 shadow-inner flex items-center justify-center">
                  <span className="text-2xl font-black text-emerald-300">16A</span>
                </div>
                <h1 className="font-bold text-lg tracking-wider">NUANSA16A</h1>
                <p className="text-xs text-emerald-300 mt-1">Buku Kas & Tabungan Warga</p>
              </div>
              <nav className="flex-1 p-4 space-y-1 overflow-y-auto text-sm">
                {menuList.map((menu) => (
                  <button
                    key={menu}
                    onClick={() => { setActiveMenu(menu); setIsSidebarOpen(false); }}
                    className={`w-full text-left px-4 py-2.5 rounded-lg transition font-medium ${activeMenu === menu ? (menu === 'Revisi' ? 'bg-rose-700 text-white shadow-md' : 'bg-emerald-700 text-white shadow-md') : 'text-emerald-100 hover:bg-emerald-800'}`}
                  >
                    {menu === 'Revisi' ? '⚠️ Revisi Admin' : menu}
                  </button>
                ))}
              </nav>
              <div className="p-4 border-t border-emerald-800">
                <button onClick={() => setLoggedInUser(null)} className="w-full bg-rose-600 hover:bg-rose-700 text-white font-medium px-4 py-2 rounded-lg transition text-sm shadow">
                  Keluar Sistem
                </button>
              </div>
            </div>

            {/* Main Content */}
            <div className="flex-1 flex flex-col overflow-hidden w-full">
              <header className="bg-white/90 backdrop-blur-sm shadow-sm h-16 flex items-center justify-between px-4 md:px-8 border-b border-slate-200">
                <div className="flex items-center space-x-3">
                  {activeMenu !== 'Dashboard' && (
                    <button 
                      onClick={() => setActiveMenu('Dashboard')} 
                      className="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1 shadow-sm"
                    >
                      ← Kembali
                    </button>
                  )}
                  <h2 className="text-base md:text-xl font-bold text-emerald-800 truncate">{activeMenu}</h2>
                </div>
                <div className="text-xs md:text-sm text-slate-600 text-right">
                  <span className="hidden sm:inline">Login sebagai: </span><strong className="text-emerald-700">{loggedInUser.nama}</strong> <span className="text-xs text-slate-500">({loggedInUser.role})</span>
                </div>
              </header>

              <main className="flex-1 overflow-y-auto p-4 md:p-8">
                {/* DASHBOARD */}
                {activeMenu === 'Dashboard' && (
                  <div className="space-y-6">
                    <div className="flex justify-between items-center">
                      <h3 className="text-base md:text-lg font-bold text-slate-700">Ringkasan Saldo Real-Time Otomatis</h3>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                      <div className="bg-white/95 backdrop-blur p-5 md:p-6 rounded-xl shadow-sm border-l-4 border-emerald-600">
                        <p className="text-xs text-slate-500 uppercase font-semibold">Total Saldo Kas Gang</p>
                        <h3 className="text-xl md:text-2xl font-bold text-slate-800 mt-2">Rp {totalKasGang.toLocaleString('id-ID')}</h3>
                        <p className="text-xs text-emerald-600 mt-1 font-medium">PIC: {leaders.find(l => l.pic_modul === 'Kas Gang')?.nama || 'Belum Ditentukan'}</p>
                      </div>
                      <div className="bg-white/95 backdrop-blur p-5 md:p-6 rounded-xl shadow-sm border-l-4 border-emerald-600">
                        <p className="text-xs text-slate-500 uppercase font-semibold">Total Saldo Cor Jalan</p>
                        <h3 className="text-xl md:text-2xl font-bold text-slate-800 mt-2">Rp {totalCorJalan.toLocaleString('id-ID')}</h3>
                        <p className="text-xs text-emerald-600 mt-1 font-medium">PIC: {leaders.find(l => l.pic_modul === 'Cor Jalan')?.nama || 'Belum Ditentukan'}</p>
                      </div>
                      <div className="bg-white/95 backdrop-blur p-5 md:p-6 rounded-xl shadow-sm border-l-4 border-emerald-600">
                        <p className="text-xs text-slate-500 uppercase font-semibold">Total Saldo Jimpitan</p>
                        <h3 className="text-xl md:text-2xl font-bold text-slate-800 mt-2">Rp {totalJimpitan.toLocaleString('id-ID')}</h3>
                        <p className="text-xs text-emerald-600 mt-1 font-medium">PIC: {leaders.find(l => l.pic_modul === 'Jimpitan')?.nama || 'Belum Ditentukan'}</p>
                      </div>
                      <div className="bg-white/95 backdrop-blur p-5 md:p-6 rounded-xl shadow-sm border-l-4 border-emerald-600">
                        <p className="text-xs text-slate-500 uppercase font-semibold">Total Saldo Ibu Ibu</p>
                        <h3 className="text-xl md:text-2xl font-bold text-slate-800 mt-2">Rp {totalIbuIbu.toLocaleString('id-ID')}</h3>
                        <p className="text-xs text-emerald-600 mt-1 font-medium">PIC: {leaders.find(l => l.pic_modul === 'Keuangan Ibu Ibu')?.nama || 'Belum Ditentukan'}</p>
                      </div>
                    </div>
                  </div>
                )}

                {/* MENU REVISI ADMIN */}
                {activeMenu === 'Revisi' && isAdmin && (
                  <div className="space-y-6">
                    <div className="bg-rose-50 border border-rose-200 p-4 rounded-xl text-rose-800 text-sm">
                      <strong>Pusat Koreksi Data Admin:</strong> Hapus transaksi yang salah input oleh pengurus.
                    </div>
                    <div className="bg-white/95 backdrop-blur p-4 md:p-6 rounded-xl shadow-sm space-y-4">
                      <h3 className="font-bold text-slate-700 text-sm md:text-base">Revisi Transaksi Kas Gang</h3>
                      <div className="table-responsive">
                        <table className="w-full text-left text-sm border-collapse min-w-[500px]">
                          <thead>
                            <tr className="border-b bg-slate-50">
                              <th className="p-2">Tanggal</th>
                              <th className="p-2">Uraian</th>
                              <th className="p-2">Masuk</th>
                              <th className="p-2">Keluar</th>
                              <th className="p-2 text-right">Aksi</th>
                            </tr>
                          </thead>
                          <tbody>
                            {kasGangList.map(item => (
                              <tr key={item.id} className="border-b hover:bg-slate-50">
                                <td className="p-2">{item.tanggal}</td>
                                <td className="p-2">{item.uraian}</td>
                                <td className="p-2 text-emerald-600">Rp {(item.masuk || 0).toLocaleString('id-ID')}</td>
                                <td className="p-2 text-rose-600">Rp {(item.keluar || 0).toLocaleString('id-ID')}</td>
                                <td className="p-2 text-right">
                                  <button onClick={() => handleRevisiHapus(item.id, 'kas-gang')} className="bg-rose-600 text-white px-3 py-1 rounded text-xs hover:bg-rose-700">Hapus</button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {/* MODUL KAS UMUM */}
                {['Kas Gang', 'Cor Jalan', 'Keuangan Ibu Ibu', 'Jimpitan'].includes(activeMenu) && (
                  <div className="space-y-6">
                    {!isWarga && (
                      <div className="bg-white/95 backdrop-blur p-4 md:p-6 rounded-xl shadow-sm">
                        <h3 className="font-bold text-slate-700 mb-4 text-sm md:text-base">Input Transaksi {activeMenu}</h3>
                        <form onSubmit={(e) => handleSaveKas(e, activeMenu === 'Keuangan Ibu Ibu' ? 'ibu-ibu' : activeMenu.toLowerCase().replace(' ', '-'))} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 md:gap-4">
                          <input type="date" value={formKas.tanggal} onChange={e => setFormKas({ ...formKas, tanggal: e.target.value })} className="border p-2 rounded text-sm" required />
                          {activeMenu === 'Jimpitan' ? (
                            <input type="text" placeholder="Nama Warga / Donatur" value={formKas.nama_warga} onChange={e => setFormKas({ ...formKas, nama_warga: e.target.value })} className="border p-2 rounded text-sm" required />
                          ) : (
                            <input type="text" placeholder="Uraian Transaksi" value={formKas.uraian} onChange={e => setFormKas({ ...formKas, uraian: e.target.value })} className="border p-2 rounded text-sm" required />
                          )}
                          <input type="number" placeholder="Masuk (Rp)" value={formKas.masuk} onChange={e => setFormKas({ ...formKas, masuk: Number(e.target.value) })} className="border p-2 rounded text-sm" />
                          <input type="number" placeholder="Keluar (Rp)" value={formKas.keluar} onChange={e => setFormKas({ ...formKas, keluar: Number(e.target.value) })} className="border p-2 rounded text-sm" />
                          <button type="submit" className="bg-emerald-600 text-white rounded p-2 hover:bg-emerald-700 text-sm font-medium">Simpan</button>
                        </form>
                      </div>
                    )}

                    <div className="bg-white/95 backdrop-blur p-4 md:p-6 rounded-xl shadow-sm overflow-x-auto">
                      <div className="table-responsive">
                        <table className="w-full text-left text-sm border-collapse min-w-[500px]">
                          <thead>
                            <tr className="border-b bg-slate-50">
                              <th className="p-3">Tanggal</th>
                              <th className="p-3">{activeMenu === 'Jimpitan' ? 'Nama Warga' : 'Uraian'}</th>
                              <th className="p-3 text-emerald-600">Masuk</th>
                              <th className="p-3 text-rose-600">Keluar</th>
                              <th className="p-3">Penginput / PIC</th>
                            </tr>
                          </thead>
                          <tbody>
                            {(activeMenu === 'Kas Gang' ? kasGangList : activeMenu === 'Cor Jalan' ? corJalanList : activeMenu === 'Jimpitan' ? jimpitanList : ibuIbuList).map(item => (
                              <tr key={item.id} className="border-b hover:bg-slate-50">
                                <td className="p-3">{item.tanggal}</td>
                                <td className="p-3 font-medium">{item.uraian || item.nama_warga}</td>
                                <td className="p-3 text-emerald-600">Rp {(item.masuk || item.nominal || 0).toLocaleString('id-ID')}</td>
                                <td className="p-3 text-rose-600 font-bold">Rp {(item.keluar || 0).toLocaleString('id-ID')}</td>
                                <td className="p-3 text-slate-500">{item.input_oleh || 'Sistem'}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {/* MENU DATA PENGURUS & PENGATURAN PIC MODUL */}
                {activeMenu === 'Data Pengurus' && (
                  <div className="space-y-6">
                    {isAdmin && (
                      <div className="bg-white/95 backdrop-blur p-4 md:p-6 rounded-xl shadow-sm border border-slate-200">
                        <h3 className="font-bold text-slate-700 mb-4 text-sm md:text-base">{formLeader.id ? 'Edit Data Pengurus & PIC' : 'Form Input Pengurus & Penugasan PIC Modul (Admin)'}</h3>
                        <form onSubmit={handleSaveLeader} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4">
                          <input type="text" placeholder="Nama Lengkap Pengurus" value={formLeader.nama} onChange={e => setFormLeader({ ...formLeader, nama: e.target.value })} className="border p-2 rounded text-sm" required />
                          <input type="text" placeholder="Jabatan (cth: Bendahara RT)" value={formLeader.jabatan} onChange={e => setFormLeader({ ...formLeader, jabatan: e.target.value })} className="border p-2 rounded text-sm" required />
                          <input type="text" placeholder="No HP (Login OTP Pengurus)" value={formLeader.no_hp} onChange={e => setFormLeader({ ...formLeader, no_hp: e.target.value })} className="border p-2 rounded text-sm" required />
                          <select value={formLeader.pic_modul} onChange={e => setFormLeader({ ...formLeader, pic_modul: e.target.value })} className="border p-2 rounded text-sm">
                            <option value="Kas Gang">PIC Kas Gang</option>
                            <option value="Cor Jalan">PIC Cor Jalan</option>
                            <option value="Jimpitan">PIC Jimpitan</option>
                            <option value="Keuangan Ibu Ibu">PIC Keuangan Ibu Ibu</option>
                          </select>
                          <button type="submit" className="sm:col-span-2 lg:col-span-4 bg-emerald-600 text-white rounded p-2.5 hover:bg-emerald-700 font-medium text-sm">Simpan Data Pengurus & PIC</button>
                        </form>
                      </div>
                    )}

                    <div className="bg-white/95 backdrop-blur p-4 md:p-6 rounded-xl shadow-sm">
                      <h3 className="font-bold text-slate-700 mb-3 text-sm md:text-base">Daftar Pengurus & Penanggung Jawab Modul (PIC)</h3>
                      <div className="table-responsive">
                        <table className="w-full text-left text-sm border-collapse min-w-[600px]">
                          <thead>
                            <tr className="border-b bg-slate-50">
                              <th className="p-3">Nama Pengurus</th>
                              <th className="p-3">Jabatan</th>
                              <th className="p-3">Nomor HP (Login OTP)</th>
                              <th className="p-3">Penanggung Jawab (PIC Modul)</th>
                              {isAdmin && <th className="p-3 text-right">Aksi</th>}
                            </tr>
                          </thead>
                          <tbody>
                            {leaders.map(l => (
                              <tr key={l.id} className="border-b hover:bg-slate-50">
                                <td className="p-3 font-medium">{l.nama}</td>
                                <td className="p-3">{l.jabatan}</td>
                                <td className="p-3">{l.no_hp}</td>
                                <td className="p-3"><span className="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full text-xs font-semibold">{l.pic_modul || 'Kas Gang'}</span></td>
                                {isAdmin && (
                                  <td className="p-3 text-right space-x-2">
                                    <button onClick={() => setFormLeader(l)} className="text-amber-600 font-semibold hover:underline">Edit</button>
                                    <button onClick={() => handleDeleteLeader(l.id)} className="text-rose-600 font-semibold hover:underline">Hapus</button>
                                  </td>
                                )}
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {/* MENU DATA WARGA & MONITORING TAGIHAN */}
                {activeMenu === 'Data Warga' && (
                  <div className="space-y-6">
                    {isAdmin && (
                      <div className="bg-white/95 backdrop-blur p-4 md:p-6 rounded-xl shadow-sm border border-slate-200">
                        <h3 className="font-bold text-slate-700 mb-4 text-sm md:text-base">{formMember.id ? 'Edit Data Warga' : 'Form Input Data Warga Baru (Admin)'}</h3>
                        <form onSubmit={handleSaveMember} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4">
                          <input type="text" placeholder="NIK" value={formMember.nik} onChange={e => setFormMember({ ...formMember, nik: e.target.value })} className="border p-2 rounded text-sm" />
                          <input type="text" placeholder="Nama Lengkap Warga" value={formMember.nama} onChange={e => setFormMember({ ...formMember, nama: e.target.value })} className="border p-2 rounded text-sm" required />
                          <input type="text" placeholder="Alamat / Blok Rumah" value={formMember.alamat} onChange={e => setFormMember({ ...formMember, alamat: e.target.value })} className="border p-2 rounded text-sm" />
                          <input type="text" placeholder="Nomor HP (Login OTP)" value={formMember.no_hp} onChange={e => setFormMember({ ...formMember, no_hp: e.target.value })} className="border p-2 rounded text-sm" required />
                          <select value={formMember.kategori} onChange={e => setFormMember({ ...formMember, kategori: e.target.value })} className="border p-2 rounded text-sm">
                            <option value="Warga Tetap">Warga Tetap</option>
                            <option value="Warga Kontrak">Warga Kontrak</option>
                          </select>
                          <button type="submit" className="bg-emerald-600 text-white rounded p-2 hover:bg-emerald-700 font-medium text-sm">Simpan Warga</button>
                        </form>
                      </div>
                    )}

                    {!isWarga && (
                      <div className="bg-emerald-50/90 backdrop-blur border border-emerald-200 p-4 md:p-6 rounded-xl shadow-sm">
                        <h3 className="font-bold text-emerald-800 mb-4 text-sm md:text-base">Input Iuran Bulanan Warga</h3>
                        <form onSubmit={handleSaveIuran} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 md:gap-4">
                          <select value={formIuran.warga_id} onChange={e => setFormIuran({ ...formIuran, warga_id: e.target.value })} className="border p-2 rounded text-sm" required>
                            <option value="">-- Pilih Warga --</option>
                            {members.map(w => <option key={w.id} value={w.id}>{w.nama} ({w.alamat})</option>)}
                          </select>
                          <select value={formIuran.bulan} onChange={e => setFormIuran({ ...formIuran, bulan: e.target.value })} className="border p-2 rounded text-sm">
                            {['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'].map(b => <option key={b} value={b}>{b}</option>)}
                          </select>
                          <input type="text" value={formIuran.tahun} onChange={e => setFormIuran({ ...formIuran, tahun: e.target.value })} className="border p-2 rounded text-sm" placeholder="Tahun" required />
                          <input type="number" placeholder="Nominal" value={formIuran.nominal} onChange={e => setFormIuran({ ...formIuran, nominal: Number(e.target.value) })} className="border p-2 rounded text-sm" required />
                          <button type="submit" className="bg-emerald-600 text-white rounded p-2 hover:bg-emerald-700 text-sm">Simpan Iuran</button>
                        </form>
                      </div>
                    )}

                    <div className="bg-white/95 backdrop-blur p-4 md:p-6 rounded-xl shadow-sm space-y-6">
                      <div>
                        <h3 className="font-bold text-slate-700 mb-3 text-sm md:text-base">Monitoring Data Warga & Status Tagihan Aktif</h3>
                        <div className="table-responsive">
                          <table className="w-full text-left text-sm border-collapse min-w-[600px]">
                            <thead>
                              <tr className="border-b bg-slate-50">
                                <th className="p-3">Nama Warga</th>
                                <th className="p-3">Alamat</th>
                                <th className="p-3">No HP</th>
                                <th className="p-3">Kategori</th>
                                <th className="p-3">Status Iuran</th>
                                {isAdmin && <th className="p-3 text-right">Aksi</th>}
                              </tr>
                            </thead>
                            <tbody>
                              {members.map(m => {
                                const riwayatWarga = iuranList.filter(i => i.warga_id === m.id);
                                const sudahBayarBulanIni = riwayatWarga.length > 0;
                                return (
                                  <tr key={m.id} className="border-b hover:bg-slate-50">
                                    <td className="p-3 font-medium">{m.nama}</td>
                                    <td className="p-3">{m.alamat}</td>
                                    <td className="p-3">{m.no_hp}</td>
                                    <td className="p-3">{m.kategori}</td>
                                    <td className="p-3">
                                      {sudahBayarBulanIni ? (
                                        <span className="bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full text-xs font-semibold">Lunas ({riwayatWarga.length}x)</span>
                                      ) : (
                                        <span className="bg-rose-100 text-rose-700 px-2.5 py-1 rounded-full text-xs font-semibold">Belum Bayar</span>
                                      )}
                                    </td>
                                    {isAdmin && (
                                      <td className="p-3 text-right space-x-2">
                                        <button onClick={() => setFormMember(m)} className="text-amber-600 font-semibold hover:underline">Edit</button>
                                        <button onClick={() => handleDeleteMember(m.id)} className="text-rose-600 font-semibold hover:underline">Hapus</button>
                                      </td>
                                    )}
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </main>
            </div>
          </div>
        );
      }

      // LOGIN PAGE
      return (
        <div className="min-h-screen flex items-center justify-center p-4" style={{
          backgroundImage: `linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), url('https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1200&q=80')`,
          backgroundSize: 'cover',
          backgroundPosition: 'center'
        }}>
          <div className="bg-white/95 backdrop-blur-md max-w-md w-full rounded-2xl shadow-2xl border border-slate-200 overflow-hidden">
            <div className="bg-emerald-700 p-6 text-white text-center flex flex-col items-center">
              <div className="w-16 h-16 rounded-full bg-emerald-800 border-2 border-emerald-400 overflow-hidden mb-3 shadow-md flex items-center justify-center">
                <span className="text-2xl font-black text-emerald-300">16A</span>
              </div>
              <h2 className="text-xl font-bold tracking-wide">BUKU KAS & TABUNGAN WARGA</h2>
              <p className="text-emerald-100 text-xs mt-1">NUANSA16A C3/C8</p>

              <div className="grid grid-cols-3 gap-1 bg-emerald-800 rounded-lg p-1 mt-4 text-xs font-semibold w-full">
                <button onClick={() => { setLoginMode('ADMIN'); setErrorMsg(''); setSuccessMsg(''); }} className={`py-1.5 rounded-md ${loginMode === 'ADMIN' ? 'bg-white text-emerald-900 shadow' : 'text-emerald-200'}`}>Admin</button>
                <button onClick={() => { setLoginMode('LEADER_OTP'); setErrorMsg(''); setSuccessMsg(''); }} className={`py-1.5 rounded-md ${loginMode === 'LEADER_OTP' ? 'bg-white text-emerald-900 shadow' : 'text-emerald-200'}`}>Pengurus</button>
                <button onClick={() => { setLoginMode('WARGA_OTP'); setErrorMsg(''); setSuccessMsg(''); }} className={`py-1.5 rounded-md ${loginMode === 'WARGA_OTP' ? 'bg-white text-emerald-900 shadow' : 'text-emerald-200'}`}>Warga</button>
              </div>
            </div>

            <div className="p-6">
              {errorMsg && <div className="mb-4 bg-rose-100 border border-rose-300 text-rose-700 px-4 py-3 rounded-lg text-sm">{errorMsg}</div>}
              {successMsg && <div className="mb-4 bg-amber-100 border border-amber-300 text-amber-800 px-4 py-3 rounded-lg text-sm">{successMsg}</div>}
              {devOtpMsg && <div className="mb-4 bg-emerald-100 border border-emerald-300 text-emerald-800 px-4 py-2 rounded-lg text-xs font-mono">{devOtpMsg}</div>}

              {loginMode === 'ADMIN' && (
                <form onSubmit={handleLoginAdmin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Username Admin</label>
                    <input type="text" value={username} onChange={e => setUsername(e.target.value)} className="w-full px-4 py-2 border rounded-lg text-sm" required />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                    <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full px-4 py-2 border rounded-lg text-sm" required />
                  </div>
                  <button type="submit" className="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg text-sm shadow">Masuk Admin</button>
                </form>
              )}

              {loginMode === 'LEADER_OTP' && (
                <div className="space-y-4">
                  {!otpSent ? (
                    <form onSubmit={(e) => handleRequestOtp(e, 'LEADER')} className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nomor HP Pengurus</label>
                        <input type="text" value={noHpLeader} onChange={e => setNoHpLeader(e.target.value)} className="w-full px-4 py-2 border rounded-lg text-sm" placeholder="08..." required />
                      </div>
                      <button type="submit" className="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg text-sm shadow">Kirim OTP Pengurus</button>
                    </form>
                  ) : (
                    <form onSubmit={(e) => handleVerifyOtp(e, 'LEADER')} className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Kode OTP 4 Digit</label>
                        <input type="text" value={otpCode} onChange={e => setOtpCode(e.target.value)} className="w-full px-4 py-2 border text-center font-mono text-xl tracking-widest rounded-lg" maxLength="4" required />
                      </div>
                      <button type="submit" className="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg text-sm shadow">Verifikasi & Masuk</button>
                    </form>
                  )}
                </div>
              )}

              {loginMode === 'WARGA_OTP' && (
                <div className="space-y-4">
                  {!otpSent ? (
                    <form onSubmit={(e) => handleRequestOtp(e, 'WARGA')} className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nomor HP Warga</label>
                        <input type="text" value={noHpWarga} onChange={e => setNoHpWarga(e.target.value)} className="w-full px-4 py-2 border rounded-lg text-sm" placeholder="08..." required />
                      </div>
                      <button type="submit" className="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg text-sm shadow">Kirim OTP Warga</button>
                    </form>
                  ) : (
                    <form onSubmit={(e) => handleVerifyOtp(e, 'WARGA')} className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Kode OTP 4 Digit</label>
                        <input type="text" value={otpCode} onChange={e => setOtpCode(e.target.value)} className="w-full px-4 py-2 border text-center font-mono text-xl tracking-widest rounded-lg" maxLength="4" required />
                      </div>
                      <button type="submit" className="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg text-sm shadow">Verifikasi & Masuk</button>
                    </form>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
