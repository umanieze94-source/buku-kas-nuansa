<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUKU KAS & TABUNGAN WARGA NUANSA16A</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; }
    button:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect} = React;

const MENUS = [
  "Dashboard", "Kas Gang", "Cor Jalan", "Jimpitan",
  "Ibu-Ibu", "Data Warga", "Data Leader", "Agenda",
  "Backup Data"
];

function App() {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [loggedInUser, setLoggedInUser] = useState(null);
  const [activeMenu, setActiveMenu] = useState("Dashboard");
  const [errorMsg, setErrorMsg] = useState("");
  const [successMsg, setSuccessMsg] = useState("");
  const [loading, setLoading] = useState(false);
  const [showPasswordChange, setShowPasswordChange] = useState(false);

  // State Data dari Server
  const [members, setMembers] = useState([]);
  const [leaders, setLeaders] = useState([]);
  const [kasGang, setKasGang] = useState([]);
  const [agenda, setAgenda] = useState([]);

  // Form Transaksi Kas
  const [formKas, setFormKas] = useState({
    tanggal: new Date().toISOString().slice(0,10),
    uraian: "",
    masuk: "",
    keluar: "",
    input_oleh: ""
  });

  // Fetch Data dari Backend saat Login
  useEffect(() => {
    if (loggedInUser) {
      fetchAllData();
    }
  }, [loggedInUser]);

  const fetchAllData = async () => {
    try {
      const [resMembers, resLeaders, resKas, resAgenda] = await Promise.all([
        fetch("/api/members").then(res => res.json()),
        fetch("/api/leaders").then(res => res.json()),
        fetch("/api/kas-gang").then(res => res.json()),
        fetch("/api/agenda").then(res => res.json())
      ]);

      if (resMembers.success) setMembers(resMembers.data);
      if (resLeaders.success) setLeaders(resLeaders.data);
      if (resKas.success) setKasGang(resKas.data);
      if (resAgenda.success) setAgenda(resAgenda.data);
    } catch (err) {
      console.error("Gagal memuat data dari server:", err);
    }
  };

  const formatRupiah = value =>
    new Intl.NumberFormat("id-ID", {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }).format(Number(value) || 0);

  const handleLogin = async e => {
    e.preventDefault();
    setErrorMsg("");
    setLoading(true);

    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password})
      });

      const data = await response.json();
      if (!response.ok || !data.success) {
        throw new Error(data.message || "Login gagal.");
      }

      if (data.user.mustChangePassword) {
        setShowPasswordChange(true);
        setSuccessMsg("Silakan ganti password default Anda (minimal 12 karakter).");
      } else {
        setLoggedInUser(data.user);
      }
    } catch (error) {
      setErrorMsg(error.message || "Gagal terhubung ke server.");
    } finally {
      setLoading(false);
    }
  };

  const handleChangePassword = async e => {
    e.preventDefault();
    if (newPassword.length < 12) {
      setErrorMsg("Password baru minimal 12 karakter.");
      return;
    }

    setLoading(true);
    try {
      const response = await fetch("/api/change-password", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, newPassword})
      });
      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(data.message || "Gagal mengganti password.");
      }

      setShowPasswordChange(false);
      setPassword("");
      setNewPassword("");
      setSuccessMsg("Password berhasil diperbarui. Silakan login ulang.");
    } catch (error) {
      setErrorMsg(error.message || "Gagal mengganti password.");
    } finally {
      setLoading(false);
    }
  };

  const handleTambahKas = async (e, routeName) => {
    e.preventDefault();
    try {
      const res = await fetch(`/api/${routeName}`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({...formKas, input_oleh: loggedInUser?.nama})
      });
      const data = await res.json();
      if (data.success) {
        setSuccessMsg("Data kas berhasil disimpan.");
        setFormKas({ tanggal: new Date().toISOString().slice(0,10), uraian: "", masuk: "", keluar: "", input_oleh: "" });
        fetchAllData();
      } else {
        setErrorMsg(data.message);
      }
    } catch (err) {
      setErrorMsg("Gagal menyimpan transaksi.");
    }
  };

  if (!loggedInUser) {
    return (
      <div className="min-h-screen flex items-center justify-center p-4">
        <div className="bg-white max-w-md w-full rounded-2xl shadow-xl border overflow-hidden">
          <div className="bg-emerald-700 p-6 text-white text-center">
            <h2 className="text-xl font-bold">BUKU KAS & TABUNGAN WARGA</h2>
            <p className="text-emerald-100 text-sm mt-1">NUANSA16A</p>
          </div>
          <div className="p-6">
            {errorMsg && <div className="bg-rose-100 text-rose-700 p-3 rounded mb-4 text-sm">{errorMsg}</div>}
            {successMsg && <div className="bg-emerald-100 text-emerald-700 p-3 rounded mb-4 text-sm">{successMsg}</div>}

            {!showPasswordChange ? (
              <form onSubmit={handleLogin} className="space-y-4">
                <label className="block text-sm font-semibold">
                  Username
                  <input className="w-full border rounded-lg p-3 mt-1" value={username}
                    onChange={e=>setUsername(e.target.value)} required />
                </label>
                <label className="block text-sm font-semibold">
                  Password
                  <input type="password" className="w-full border rounded-lg p-3 mt-1"
                    value={password} onChange={e=>setPassword(e.target.value)} required />
                </label>
                <button disabled={loading} className="w-full bg-emerald-600 text-white p-3 rounded-lg font-bold">
                  {loading ? "Memproses..." : "Masuk"}
                </button>
              </form>
            ) : (
              <form onSubmit={handleChangePassword} className="space-y-4">
                <label className="block text-sm font-semibold">
                  Password Baru (Min. 12 Karakter)
                  <input type="password" className="w-full border rounded-lg p-3 mt-1"
                    value={newPassword} onChange={e=>setNewPassword(e.target.value)}
                    minLength="12" required />
                </label>
                <button disabled={loading} className="w-full bg-amber-600 text-white p-3 rounded-lg font-bold">
                  Simpan Password Baru
                </button>
              </form>
            )}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen flex flex-col md:flex-row">
      <aside className="w-full md:w-64 bg-emerald-950 text-white flex flex-col">
        <div className="p-5 text-center border-b border-emerald-800">
          <h1 className="font-bold text-lg">NUANSA16A</h1>
          <p className="text-xs text-emerald-300">Sistem Keuangan Warga</p>
        </div>
        <nav className="flex-1 p-3 grid grid-cols-2 md:block gap-1 overflow-y-auto text-sm">
          {MENUS.map(menu => (
            <button key={menu} onClick={()=>{setActiveMenu(menu);setErrorMsg("");setSuccessMsg("");}}
              className={`w-full text-left px-3 py-2.5 rounded-lg mb-1 ${activeMenu===menu?"bg-emerald-700":"hover:bg-emerald-800"}`}>
              {menu}
            </button>
          ))}
        </nav>
        <div className="p-4 border-t border-emerald-800">
          <p className="text-xs mb-3">Login: <b>{loggedInUser.nama}</b></p>
          <button onClick={()=>setLoggedInUser(null)} className="w-full bg-rose-600 p-2 rounded-lg text-sm font-semibold">Keluar</button>
        </div>
      </aside>

      <main className="flex-1 min-w-0">
        <header className="bg-white shadow-sm p-5 border-b">
          <h2 className="font-bold text-xl text-emerald-800">{activeMenu}</h2>
        </header>
        <section className="p-4 md:p-8 space-y-4">
          {errorMsg && <div className="bg-rose-100 text-rose-700 p-3 rounded">{errorMsg}</div>}
          {successMsg && <div className="bg-emerald-100 text-emerald-700 p-3 rounded">{successMsg}</div>}

          {activeMenu === "Dashboard" && (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="bg-white p-5 rounded-xl shadow border-l-4 border-emerald-600">
                <p className="text-xs text-slate-500 font-semibold">Total Warga Terdaftar</p>
                <h3 className="text-2xl font-bold mt-2">{members.length} Orang</h3>
              </div>
              <div className="bg-white p-5 rounded-xl shadow border-l-4 border-emerald-600">
                <p className="text-xs text-slate-500 font-semibold">Total Pengurus (Leader)</p>
                <h3 className="text-2xl font-bold mt-2">{leaders.length} Orang</h3>
              </div>
              <div className="bg-white p-5 rounded-xl shadow border-l-4 border-emerald-600">
                <p className="text-xs text-slate-500 font-semibold">Total Transaksi Kas Gang</p>
                <h3 className="text-2xl font-bold mt-2">{kasGang.length} Catatan</h3>
              </div>
            </div>
          )}

          {activeMenu === "Kas Gang" && (
            <div className="space-y-5">
              <form onSubmit={e=>handleTambahKas(e, 'kas-gang')} className="bg-white p-5 rounded-xl shadow grid md:grid-cols-2 gap-4">
                <h3 className="font-bold text-lg md:col-span-2">Catat Transaksi Kas Gang</h3>
                <label className="text-sm font-semibold">Tanggal
                  <input type="date" className="w-full border rounded p-3 mt-1"
                    value={formKas.tanggal} onChange={e=>setFormKas({...formKas, tanggal:e.target.value})} required />
                </label>
                <label className="text-sm font-semibold">Uraian / Keterangan
                  <input className="w-full border rounded p-3 mt-1"
                    value={formKas.uraian} onChange={e=>setFormKas({...formKas, uraian:e.target.value})} placeholder="Contoh: Pembelian semen" required />
                </label>
                <label className="text-sm font-semibold">Pemasukan (Masuk)
                  <input type="number" min="0" className="w-full border rounded p-3 mt-1"
                    value={formKas.masuk} onChange={e=>setFormKas({...formKas, masuk:e.target.value})} />
                </label>
                <label className="text-sm font-semibold">Pengeluaran (Keluar)
                  <input type="number" min="0" className="w-full border rounded p-3 mt-1"
                    value={formKas.keluar} onChange={e=>setFormKas({...formKas, kelar:e.target.value})} />
                </label>
                <button className="bg-emerald-600 text-white p-3 rounded-lg font-bold md:col-span-2">Simpan Transaksi Kas</button>
              </form>

              <div className="bg-white rounded-xl p-5 shadow overflow-x-auto">
                <h3 className="font-bold mb-3">Riwayat Kas Gang</h3>
                <table className="w-full text-sm text-left">
                  <thead className="bg-slate-100">
                    <tr><th className="p-3">Tanggal</th><th className="p-3">Uraian</th><th className="p-3 text-right">Masuk</th><th className="p-3 text-right">Keluar</th><th className="p-3">Input Oleh</th></tr>
                  </thead>
                  <tbody>
                    {kasGang.map(k => (
                      <tr key={k.id} className="border-b">
                        <td className="p-3">{k.tanggal}</td>
                        <td className="p-3">{k.uraian}</td>
                        <td className="p-3 text-right text-emerald-600 font-semibold">{formatRupiah(k.masuk)}</td>
                        <td className="p-3 text-right text-rose-600 font-semibold">{formatRupiah(k.keluar)}</td>
                        <td className="p-3 text-slate-500">{k.input_oleh || '-'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {activeMenu === "Data Warga" && (
            <div className="bg-white p-6 rounded-xl shadow space-y-4">
              <h3 className="font-bold text-lg">Daftar Warga Terdaftar ({members.length})</h3>
              <div className="overflow-x-auto">
                <table className="w-full text-sm text-left">
                  <thead className="bg-slate-100">
                    <tr><th className="p-3">Nama</th><th className="p-3">NIK</th><th className="p-3">Alamat</th><th className="p-3">No HP</th><th className="p-3">Kategori</th></tr>
                  </thead>
                  <tbody>
                    {members.map(m => (
                      <tr key={m.id} className="border-b">
                        <td className="p-3 font-semibold">{m.nama}</td>
                        <td className="p-3">{m.nik || '-'}</td>
                        <td className="p-3">{m.alamat || '-'}</td>
                        <td className="p-3">{m.no_hp || '-'}</td>
                        <td className="p-3">{m.kategori || '-'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {activeMenu === "Backup Data" && (
            <div className="bg-white p-6 rounded-xl shadow space-y-4">
              <h3 className="font-bold text-lg">Backup Database SQLite</h3>
              <p className="text-sm text-slate-600">Unduh salinan file database server secara langsung untuk arsip keamanan.</p>
              <a href="/api/admin/backup" target="_blank" className="inline-block bg-emerald-600 text-white px-5 py-3 rounded-lg font-bold">
                Unduh File Backup Database (.sqlite)
              </a>
            </div>
          )}
        </section>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
