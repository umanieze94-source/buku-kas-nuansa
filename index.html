<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Administrasi Warga - NUANSA16A</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F766E',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                        bgapp: '#F8FAFC'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bgapp text-slate-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [user, setUser] = React.useState(null);
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [stats, setStats] = React.useState({});
            const [members, setMembers] = React.useState([]);
            const [leaders, setLeaders] = React.useState([]);
            const [assets, setAssets] = React.useState([]);
            const [announcements, setAnnouncements] = React.useState([]);
            const [auditLogs, setAuditLogs] = React.useState([]);
            const [keuangan, setKeuangan] = React.useState([]);
            const [searchQuery, setSearchQuery] = React.useState('');
            
            // Login Form State
            const [loginEmail, setLoginEmail] = React.useState('');
            const [loginPassword, setLoginPassword] = React.useState('');
            const [loginError, setLoginError] = React.useState('');

            // Realtime Clock
            const [timeStr, setTimeStr] = React.useState('');
            const [dateStr, setDateStr] = React.useState('');

            React.useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    setTimeStr(now.toLocaleTimeString('id-ID'));
                    setDateStr(now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }));
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const fetchData = async () => {
                try {
                    const resStats = await fetch('/api/dashboard/stats');
                    const dStats = await resStats.json();
                    if (dStats.success) setStats(dStats.stats);

                    const resMem = await fetch('/api/members');
                    const dMem = await resMem.json();
                    if (dMem.success) setMembers(dMem.data);

                    const resLead = await fetch('/api/leaders');
                    const dLead = await resLead.json();
                    if (dLead.success) setLeaders(dLead.data);

                    const resAsset = await fetch('/api/assets');
                    const dAsset = await resAsset.json();
                    if (dAsset.success) setAssets(dAsset.data);

                    const resAnno = await fetch('/api/announcements');
                    const dAnno = await resAnno.json();
                    if (dAnno.success) setAnnouncements(dAnno.data);

                    const resAudit = await fetch('/api/audit-logs');
                    const dAudit = await resAudit.json();
                    if (dAudit.success) setAuditLogs(dAudit.data);

                    const resKeu = await fetch('/api/keuangan');
                    const dKeu = await resKeu.json();
                    if (dKeu.success) setKeuangan(dKeu.data);
                } catch (e) {
                    console.error('Gagal mengambil data:', e);
                }
            };

            React.useEffect(() => {
                if (user) {
                    fetchData();
                    const interval = setInterval(fetchData, 5000);
                    return () => clearInterval(interval);
                }
            }, [user]);

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                setLoginError('');
                try {
                    const res = await fetch('/api/login/admin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: loginEmail, password: loginPassword })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setUser(data.user);
                    } else {
                        setLoginError(data.message || 'Login gagal.');
                    }
                } catch (err) {
                    setLoginError('Terjadi kesalahan koneksi.');
                }
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-900 px-4">
                        <div className="bg-white max-w-md w-full rounded-2xl shadow-2xl p-8 border border-slate-700">
                            <div className="text-center mb-8">
                                <div className="bg-primary text-w w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-bold shadow-lg mb-3">16A</div>
                                <h1 className="text-2xl font-bold text-slate-900">NUANSA16A</h1>
                                <p className="text-sm text-slate-500">Sistem Administrasi Warga Digital</p>
                            </div>
                            {loginError && <div className="mb-4 p-3 bg-red-50 text-red-600 rounded-lg text-sm border border-red-200">{loginError}</div>}
                            <form onSubmit={handleAdminLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Email Super Admin</label>
                                    <input type="email" required value={loginEmail} onChange={e => setLoginEmail(e.target.value)} className="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary focus:outline-none" placeholder="admin@nuansa16a.com" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Password</label>
                                    <input type="password" required value={loginPassword} onChange={e => setLoginPassword(e.target.value)} className="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary focus:outline-none" placeholder="••••••••••••" />
                                </div>
                                <button type="submit" className="w-full py-3 bg-primary hover:bg-teal-800 text-white font-semibold rounded-xl shadow-md transition duration-200">Masuk sebagai Super Admin</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    {/* Sidebar */}
                    <aside className="w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shadow-xl">
                        <div>
                            <div className="p-6 border-b border-slate-800 flex items-center space-x-3">
                                <div className="bg-primary text-white w-10 h-10 rounded-xl flex items-center justify-center font-bold">16A</div>
                                <div>
                                    <h2 className="font-bold text-white tracking-wide">NUANSA16A</h2>
                                    <p className="text-xs text-teal-400 font-medium">RT 44 / RW 13 Karawang</p>
                                </div>
                            </div>
                            <nav className="p-4 space-y-1.5 text-sm font-medium">
                                <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition ${activeTab === 'dashboard' ? 'bg-primary text-white shadow-lg' : 'hover:bg-slate-800 text-slate-400'}`}>
                                    <i className="fa-solid fa-chart-pie w-5"></i><span>Dashboard Eksekutif</span>
                                </button>
                                <button onClick={() => setActiveTab('warga')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition ${activeTab === 'warga' ? 'bg-primary text-white shadow-lg' : 'hover:bg-slate-800 text-slate-400'}`}>
                                    <i className="fa-solid fa-users w-5"></i><span>Data Warga</span>
                                </button>
                                <button onClick={() => setActiveTab('pengurus')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition ${activeTab === 'pengurus' ? 'bg-primary text-white shadow-lg' : 'hover:bg-slate-800 text-slate-400'}`}>
                                    <i className="fa-solid fa-user-tie w-5"></i><span>Data Pengurus</span>
                                </button>
                                <button onClick={() => setActiveTab('aset')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition ${activeTab === 'aset' ? 'bg-primary text-white shadow-lg' : 'hover:bg-slate-800 text-slate-400'}`}>
                                    <i className="fa-solid fa-boxes-stacked w-5"></i><span>Data Aset</span>
                                </button>
                                <button onClick={() => setActiveTab('laporan')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition ${activeTab === 'laporan' ? 'bg-primary text-white shadow-lg' : 'hover:bg-slate-800 text-slate-400'}`}>
                                    <i className="fa-solid fa-file-invoice-dollar w-5"></i><span>Laporan & Cetak</span>
                                </button>
                                <button onClick={() => setActiveTab('pengumuman')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition ${activeTab === 'pengumuman' ? 'bg-primary text-white shadow-lg' : 'hover:bg-slate-800 text-slate-400'}`}>
                                    <i className="fa-solid fa-bullhorn w-5"></i><span>Pengumuman</span>
                                </button>
                                <button onClick={() => setActiveTab('audit')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition ${activeTab === 'audit' ? 'bg-primary text-white shadow-lg' : 'hover:bg-slate-800 text-slate-400'}`}>
                                    <i className="fa-solid fa-shield-halved w-5"></i><span>Audit Log</span>
                                </button>
                                <button onClick={() => setActiveTab('backup')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition ${activeTab === 'backup' ? 'bg-primary text-white shadow-lg' : 'hover:bg-slate-800 text-slate-400'}`}>
                                    <i className="fa-solid fa-database w-5"></i><span>Backup Database</span>
                                </button>
                            </nav>
                        </div>
                        <div className="p-4 border-t border-slate-800">
                            <div className="mb-3 px-3">
                                <p className="text-xs text-slate-400">Login sebagai:</p>
                                <p className="text-sm font-semibold text-white truncate">{user.nama}</p>
                            </div>
                            <button onClick={() => setUser(null)} className="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-semibold shadow transition">Keluar</button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col min-w-0 overflow-y-auto">
                        <header className="bg-white border-b border-slate-200 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4 sticky top-0 z-10">
                            <div className="flex items-center space-x-4 w-full sm:w-auto">
                                <div className="relative w-full sm:w-80">
                                    <span className="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i className="fa-solid fa-magnifying-glass"></i></span>
                                    <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Pencarian global warga, aset..." className="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                                </div>
                            </div>
                            <div className="flex items-center space-x-4 text-sm text-slate-600 font-medium">
                                <div className="bg-teal-50 text-primary px-3 py-1.5 rounded-xl border border-teal-100 flex items-center space-x-2">
                                    <i className="fa-regular fa-calendar"></i><span>{dateStr}</span> | <i className="fa-regular fa-clock"></i><span>{timeStr}</span>
                                </div>
                            </div>
                        </header>

                        <div className="p-6">
                            {activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition">
                                            <p className="text-sm font-medium text-slate-500">Total Kekayaan Lingkungan</p>
                                            <h3 className="text-2xl font-bold text-primary mt-2">Rp {(stats.totalKekayaan || 0).toLocaleString()}</h3>
                                            <p className="text-xs text-emerald-600 mt-1 font-semibold">Aktif & Terverifikasi Realtime</p>
                                        </div>
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition">
                                            <p className="text-sm font-medium text-slate-500">Saldo Kas & Jimpitan</p>
                                            <h3 className="text-2xl font-bold text-slate-800 mt-2">Rp {((stats.saldoKas || 0) + (stats.saldoJimpitan || 0)).toLocaleString()}</h3>
                                            <p className="text-xs text-slate-400 mt-1">Kas: Rp {(stats.saldoKas || 0).toLocaleString()}</p>
                                        </div>
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition">
                                            <p className="text-sm font-medium text-slate-500">Tabungan Cor & Sosial</p>
                                            <h3 className="text-2xl font-bold text-slate-800 mt-2">Rp {((stats.saldoCor || 0) + (stats.saldoSosial || 0)).toLocaleString()}</h3>
                                            <p className="text-xs text-slate-400 mt-1">Cor: Rp {(stats.saldoCor || 0).toLocaleString()}</p>
                                        </div>
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition">
                                            <p className="text-sm font-medium text-slate-500">Nilai Total Aset</p>
                                            <h3 className="text-2xl font-bold text-slate-800 mt-2">Rp {(stats.nilaiAset || 0).toLocaleString()}</h3>
                                            <p className="text-xs text-slate-400 mt-1">Total {stats.totalAset || 0} unit aset</p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'warga' && (
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                                    <h3 className="text-lg font-bold text-slate-800 mb-4">Manajemen Data Warga</h3>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm text-slate-600">
                                            <thead className="bg-slate-50 text-slate-700 font-semibold border-b border-slate-200">
                                                <tr>
                                                    <th className="p-3">Nama Warga</th>
                                                    <th className="p-3">NIK</th>
                                                    <th className="p-3">Alamat</th>
                                                    <th className="p-3">No HP</th>
                                                    <th className="p-3">Kategori</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {members.map(m => (
                                                    <tr key={m.id} className="border-b border-slate-100 hover:bg-slate-50">
                                                        <td className="p-3 font-medium text-slate-800">{m.nama}</td>
                                                        <td className="p-3">{m.nik || '-'}</td>
                                                        <td className="p-3">{m.alamat || '-'}</td>
                                                        <td className="p-3">{m.no_hp || '-'}</td>
                                                        <td className="p-3"><span className="px-2.5 py-1 bg-teal-50 text-primary rounded-lg text-xs font-semibold">{m.kategori || 'Warga Tetap'}</span></td>
                                                    </tr>
                                                ))}
                                                {members.length === 0 && <tr><td colSpan="5" className="p-4 text-center text-slate-400">Belum ada data warga.</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'aset' && (
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                                    <h3 className="text-lg font-bold text-slate-800 mb-4">Data Aset Lingkungan</h3>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm text-slate-600">
                                            <thead className="bg-slate-50 text-slate-700 font-semibold border-b border-slate-200">
                                                <tr>
                                                    <th className="p-3">Nama Aset</th>
                                                    <th className="p-3">Kategori</th>
                                                    <th className="p-3">Nilai Pembelian</th>
                                                    <th className="p-3">Kondisi</th>
                                                    <th className="p-3">Lokasi</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {assets.map(a => (
                                                    <tr key={a.id} className="border-b border-slate-100 hover:bg-slate-50">
                                                        <td className="p-3 font-medium text-slate-800">{a.nama_aset}</td>
                                                        <td className="p-3">{a.kategori}</td>
                                                        <td className="p-3">Rp {(a.nilai_pembelian || 0).toLocaleString()}</td>
                                                        <td className="p-3"><span className="px-2.5 py-1 bg-emerald-50 text-emerald-700 rounded-lg text-xs font-semibold">{a.kondisi || 'Baik'}</span></td>
                                                        <td className="p-3">{a.lokasi || '-'}</td>
                                                    </tr>
                                                ))}
                                                {assets.length === 0 && <tr><td colSpan="5" className="p-4 text-center text-slate-400">Belum ada data aset tercatat.</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'audit' && (
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                                    <h3 className="text-lg font-bold text-slate-800 mb-4">Audit Log Aktivitas Sistem</h3>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm text-slate-600">
                                            <thead className="bg-slate-50 text-slate-700 font-semibold border-b border-slate-200">
                                                <tr>
                                                    <th className="p-3">Waktu</th>
                                                    <th className="p-3">Aksi</th>
                                                    <th className="p-3">Pelaku</th>
                                                    <th className="p-3">Detail</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {auditLogs.map(l => (
                                                    <tr key={l.id} className="border-b border-slate-100 hover:bg-slate-50">
                                                        <td className="p-3 text-slate-500">{l.waktu}</td>
                                                        <td className="p-3 font-semibold text-primary">{l.aksi}</td>
                                                        <td className="p-3">{l.pelaku}</td>
                                                        <td className="p-3">{l.detail}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'backup' && (
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 max-w-xl">
                                    <h3 className="text-lg font-bold text-slate-800 mb-2">Backup Database</h3>
                                    <p className="text-sm text-slate-500 mb-6">Unduh salinan cadangan database SQLite untuk keamanan data lingkungan.</p>
                                    <a href="/api/admin/backup" className="inline-flex items-center space-x-2 px-6 py-3 bg-primary hover:bg-teal-800 text-white font-semibold rounded-xl shadow transition">
                                        <i className="fa-solid fa-download"></i><span>Download Backup SQLite</span>
                                    </a>
                                </div>
                            )}

                            {activeTab === 'laporan' && (
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                                    <h3 className="text-lg font-bold text-slate-800 mb-4">Laporan & Cetak Keuangan</h3>
                                    <p className="text-sm text-slate-500">Pilih filter periode atau kategori transaksi untuk melakukan preview maupun export laporan.</p>
                                </div>
                            )}

                            {activeTab === 'pengumuman' && (
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                                    <h3 className="text-lg font-bold text-slate-800 mb-4">Pengumuman Warga</h3>
                                    <div className="space-y-4">
                                        {announcements.map(an => (
                                            <div key={an.id} className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                                                <h4 className="font-bold text-slate-800 text-base">{an.judul}</h4>
                                                <p className="text-sm text-slate-600 mt-1">{an.isi}</p>
                                                <p className="text-xs text-slate-400 mt-2">{an.tanggal}</p>
                                            </div>
                                        ))}
                                        {announcements.length === 0 && <p className="text-sm text-slate-400">Belum ada pengumuman aktif.</p>}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
