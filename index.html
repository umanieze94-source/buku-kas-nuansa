<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Administrasi Warga - NUANSA 16A C3/C8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#15803d',
                        success: '#22c55e',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        bgapp: '#f0fdf4',
                        darker: '#14532d'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bgapp text-slate-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [user, setUser] = React.useState(null);
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [stats, setStats] = React.useState({});
            const [members, setMembers] = React.useState([]);
            const [leaders, setLeaders] = React.useState([]);
            const [keuangan, setKeuangan] = React.useState([]);
            const [assets, setAssets] = React.useState([]);
            const [agendas, setAgendas] = React.useState([]);
            const [auditLogs, setAuditLogs] = React.useState([]);
            const [searchQuery, setSearchQuery] = React.useState('');
            const [mobileMenuOpen, setMobileMenuOpen] = React.useState(false);

            // Auth State
            const [loginMode, setLoginMode] = React.useState('admin');
            const [loginEmail, setLoginEmail] = React.useState('');
            const [loginPassword, setLoginPassword] = React.useState('');
            const [phoneNum, setPhoneNum] = React.useState('');
            const [otpSent, setOtpSent] = React.useState(false);
            const [otpCode, setOtpCode] = React.useState('');
            const [devOtpInfo, setDevOtpInfo] = React.useState('');
            const [loginError, setLoginError] = React.useState('');
            const [loginMessage, setLoginMessage] = React.useState('');

            // Modals
            const [showModalWarga, setShowModalWarga] = React.useState(false);
            const [editWargaId, setEditWargaId] = React.useState(null);
            const [formWarga, setFormWarga] = React.useState({ nik: '', nama: '', nomor_rumah: '', alamat: '', no_hp: '', kategori: 'Warga Tetap', status_iuran: 'Belum Bayar', tabungan_cor: 0, tunggakan: 0, keterangan: '' });

            const [showModalLeader, setShowModalLeader] = React.useState(false);
            const [formLeader, setFormLeader] = React.useState({ nama: '', jabatan: 'Pengurus Gang', alamat: '', no_hp: '', pic_modul: 'Kas Gang' });

            const [showModalAgenda, setShowModalAgenda] = React.useState(false);
            const [formAgenda, setFormAgenda] = React.useState({ judul: '', tanggal: new Date().toISOString().slice(0, 10), waktu: '19:00', lokasi: 'Pos Ronda RT 44', kategori: 'Rapat Warga', deskripsi: '' });

            const [showModalPengeluaran, setShowModalPengeluaran] = React.useState(false);
            const [formPengeluaran, setFormPengeluaran] = React.useState({ tanggal: new Date().toISOString().slice(0, 10), uraian: '', keluar: 0 });

            // Kas Warga Form State
            const [cariRumah, setCariRumah] = React.useState('');
            const [selectedWargaKas, setSelectedWargaKas] = React.useState(null);
            const [formKasItems, setFormKasItems] = React.useState({
                tanggal: new Date().toISOString().slice(0, 10),
                bulan_tahun: new Date().toISOString().slice(0, 7),
                iuran_bulanan: 0,
                cor_jalan: 0,
                dansos: 0,
                lain_lain: 0,
                keterangan_lain: ''
            });

            // Jimpitan PIC Form
            const [formJimpitan, setFormJimpitan] = React.useState({ tanggal: new Date().toISOString().slice(0, 10), nominal: 0, keterangan: 'Setoran Jimpitan Harian' });

            const [timeStr, setTimeStr] = React.useState('');
            const [dateStr, setDateStr] = React.useState('');

            React.useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    setTimeStr(now.toLocaleTimeString('id-ID'));
                    setDateStr(now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }));
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const fetchData = async () => {
                try {
                    const resStats = await fetch('/api/dashboard/stats');
                    const dStats = await resStats.json();
                    if (dStats.success) setStats(dStats.stats);

                    const resMem = await fetch('/api/members');
                    const dMem = await resMem.json();
                    if (dMem.success) setMembers(dMem.data);

                    const resLead = await fetch('/api/leaders');
                    const dLead = await resLead.json();
                    if (dLead.success) setLeaders(dLead.data);

                    const resKeu = await fetch('/api/keuangan');
                    const dKeu = await resKeu.json();
                    if (dKeu.success) setKeuangan(dKeu.data);

                    const resAsset = await fetch('/api/assets');
                    const dAsset = await resAsset.json();
                    if (dAsset.success) setAssets(dAsset.data);

                    const resAg = await fetch('/api/agendas');
                    const dAg = await resAg.json();
                    if (dAg.success) setAgendas(dAg.data);

                    const resAud = await fetch('/api/audit-logs');
                    const dAud = await resAud.json();
                    if (dAud.success) setAuditLogs(dAud.data);
                } catch (e) {
                    console.error('Gagal fetch data:', e);
                }
            };

            React.useEffect(() => {
                if (user) {
                    fetchData();
                    const interval = setInterval(fetchData, 5000);
                    return () => clearInterval(interval);
                }
            }, [user]);

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                setLoginError('');
                try {
                    const res = await fetch('/api/login/admin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: loginEmail, password: loginPassword })
                    });
                    const data = await res.json();
                    if (data.success) setUser(data.user);
                    else setLoginError(data.message);
                } catch (err) { setLoginError('Koneksi Gagal'); }
            };

            const handleRequestOtp = async (e) => {
                e.preventDefault();
                setLoginError('');
                try {
                    const roleTarget = loginMode === 'pengurus' ? 'PENGURUS' : 'WARGA';
                    const res = await fetch('/api/auth/request-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ no_hp: phoneNum, role_target: roleTarget })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setOtpSent(true);
                        setLoginMessage(data.message);
                        if(data.dev_otp) setDevOtpInfo(data.dev_otp);
                    } else { setLoginError(data.message); }
                } catch (err) { setLoginError('Gagal kirim OTP'); }
            };

            const handleVerifyOtp = async (e) => {
                e.preventDefault();
                try {
                    const roleTarget = loginMode === 'pengurus' ? 'PENGURUS' : 'WARGA';
                    const res = await fetch('/api/auth/verify-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ no_hp: phoneNum, otp: otpCode, role_target: roleTarget })
                    });
                    const data = await res.json();
                    if (data.success) setUser(data.user);
                    else setLoginError(data.message);
                } catch (err) { setLoginError('Verifikasi gagal'); }
            };

            const handleSaveWarga = async (e) => {
                e.preventDefault();
                const url = editWargaId ? `/api/members/${editWargaId}` : '/api/members';
                const method = editWargaId ? 'PUT' : 'POST';

                await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...formWarga, actor: user.nama })
                });
                setShowModalWarga(false);
                setEditWargaId(null);
                setFormWarga({ nik: '', nama: '', nomor_rumah: '', alamat: '', no_hp: '', kategori: 'Warga Tetap', status_iuran: 'Belum Bayar', tabungan_cor: 0, tunggakan: 0, keterangan: '' });
                fetchData();
            };

            const handleEditWargaClick = (w) => {
                setEditWargaId(w.id);
                setFormWarga({
                    nik: w.nik || '',
                    nama: w.nama,
                    nomor_rumah: w.nomor_rumah,
                    alamat: w.alamat || '',
                    no_hp: w.no_hp || '',
                    kategori: w.kategori || 'Warga Tetap',
                    status_iuran: w.status_iuran || 'Belum Bayar',
                    tabungan_cor: w.tabungan_cor || 0,
                    tunggakan: w.tunggakan || 0,
                    keterangan: w.keterangan || ''
                });
                setShowModalWarga(true);
            };

            const handleSaveLeader = async (e) => {
                e.preventDefault();
                await fetch('/api/leaders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...formLeader, actor: user.nama })
                });
                setShowModalLeader(false);
                setFormLeader({ nama: '', jabatan: 'Pengurus Gang', alamat: '', no_hp: '', pic_modul: 'Kas Gang' });
                fetchData();
            };

            const handleSaveAgenda = async (e) => {
                e.preventDefault();
                await fetch('/api/agendas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...formAgenda, actor: user.nama })
                });
                setShowModalAgenda(false);
                setFormAgenda({ judul: '', tanggal: new Date().toISOString().slice(0, 10), waktu: '19:00', lokasi: 'Pos Ronda', kategori: 'Rapat', deskripsi: '' });
                fetchData();
            };

            const handleSavePengeluaran = async (e) => {
                e.preventDefault();
                await fetch('/api/keuangan/keluar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...formPengeluaran, input_oleh: user.nama })
                });
                setShowModalPengeluaran(false);
                setFormPengeluaran({ tanggal: new Date().toISOString().slice(0, 10), uraian: '', keluar: 0 });
                fetchData();
            };

            const handleSimpanKasWarga = async (e) => {
                e.preventDefault();
                if (!selectedWargaKas) return alert('Pilih nomor rumah warga terlebih dahulu!');

                const items = [
                    { kat: 'Iuran Bulanan', val: Number(formKasItems.iuran_bulanan), uraian: `Iuran Bulanan ${formKasItems.bulan_tahun}` },
                    { kat: 'Tabungan Cor', val: Number(formKasItems.cor_jalan), uraian: `Tabungan Cor Jalan ${formKasItems.bulan_tahun}` },
                    { kat: 'Dansos', val: Number(formKasItems.dansos), uraian: `Dana Sosial ${formKasItems.bulan_tahun}` },
                    { kat: 'Lain Lain', val: Number(formKasItems.lain_lain), uraian: formKasItems.keterangan_lain || 'Lain-lain' }
                ];

                for (let item of items) {
                    if (item.val > 0) {
                        await fetch('/api/keuangan', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                kategori_transaksi: item.kat,
                                tanggal: formKasItems.tanggal,
                                bulan_tahun: formKasItems.bulan_tahun,
                                nomor_rumah: selectedWargaKas.nomor_rumah,
                                nama_warga: selectedWargaKas.nama,
                                uraian: item.uraian,
                                masuk: item.val,
                                keluar: 0,
                                input_oleh: user.nama
                            })
                        });
                    }
                }
                alert('Transaksi iuran warga berhasil disimpan dan masuk daftar bukti pembayaran!');
                setFormKasItems({ ...formKasItems, iuran_bulanan: 0, cor_jalan: 0, dansos: 0, lain_lain: 0, keterangan_lain: '' });
                setSelectedWargaKas(null);
                setCariRumah('');
                fetchData();
            };

            const handleKonfirmasiCor = async (id) => {
                await fetch(`/api/keuangan/konfirmasi-cor/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ actor: user.nama })
                });
                fetchData();
            };

            const handleSimpanJimpitan = async (e) => {
                e.preventDefault();
                await fetch('/api/jimpitan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...formJimpitan, actor: user.nama })
                });
                alert('Jimpitan harian berhasil disimpan.');
                setFormJimpitan({ tanggal: new Date().toISOString().slice(0, 10), nominal: 0, keterangan: 'Setoran Jimpitan Harian' });
                fetchData();
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-darker px-4 py-8">
                        <div className="bg-white max-w-md w-full rounded-3xl shadow-2xl p-8 border border-emerald-800">
                            <div className="text-center mb-6">
                                <div className="w-16 h-16 bg-primary text-white text-xl font-black rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-3">16A</div>
                                <h1 className="text-xl font-black text-darker">NUANSA 16A C3/C8</h1>
                                <p className="text-xs font-semibold text-primary mt-1">Sistem Administrasi Warga Digital</p>
                            </div>
                            <div className="grid grid-cols-3 gap-2 mb-6 bg-slate-100 p-1 rounded-2xl text-xs font-bold text-center">
                                <button type="button" onClick={() => { setLoginMode('admin'); setOtpSent(false); }} className={`py-2 rounded-xl transition ${loginMode === 'admin' ? 'bg-primary text-white' : 'text-slate-600'}`}>Admin</button>
                                <button type="button" onClick={() => { setLoginMode('pengurus'); setOtpSent(false); }} className={`py-2 rounded-xl transition ${loginMode === 'pengurus' ? 'bg-primary text-white' : 'text-slate-600'}`}>Pengurus</button>
                                <button type="button" onClick={() => { setLoginMode('warga'); setOtpSent(false); }} className={`py-2 rounded-xl transition ${loginMode === 'warga' ? 'bg-primary text-white' : 'text-slate-600'}`}>Warga</button>
                            </div>
                            {loginError && <div className="mb-4 p-3 bg-red-50 text-red-600 rounded-xl text-xs border font-semibold">{loginError}</div>}
                            {loginMessage && <div className="mb-4 p-3 bg-emerald-50 text-emerald-700 rounded-xl text-xs border font-semibold">{loginMessage}</div>}
                            {devOtpInfo && <div className="mb-4 p-3 bg-amber-50 text-amber-800 rounded-xl text-xs border">💡 <b>Info OTP:</b> <span className="font-mono font-bold">{devOtpInfo}</span> (Terkirim via WhatsApp)</div>}

                            {loginMode === 'admin' ? (
                                <form onSubmit={handleAdminLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1 uppercase">Email Admin</label>
                                        <input type="email" required value={loginEmail} onChange={e => setLoginEmail(e.target.value)} className="w-full px-4 py-3 border rounded-2xl text-sm bg-slate-50" placeholder="admin@nuansa16a.com" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1 uppercase">Password</label>
                                        <input type="password" required value={loginPassword} onChange={e => setLoginPassword(e.target.value)} className="w-full px-4 py-3 border rounded-2xl text-sm bg-slate-50" placeholder="••••••••" />
                                    </div>
                                    <button type="submit" className="w-full py-3.5 bg-primary text-white font-bold rounded-2xl shadow-lg text-sm">Masuk Admin</button>
                                </form>
                            ) : (
                                <div>
                                    {!otpSent ? (
                                        <form onSubmit={handleRequestOtp} className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-700 mb-1 uppercase">Nomor WhatsApp</label>
                                                <input type="text" required value={phoneNum} onChange={e => setPhoneNum(e.target.value)} className="w-full px-4 py-3 border rounded-2xl text-sm bg-slate-50" placeholder="08xxxxxxxxxx" />
                                            </div>
                                            <button type="submit" className="w-full py-3.5 bg-primary text-white font-bold rounded-2xl shadow-lg text-sm">Kirim Kode OTP WhatsApp</button>
                                        </form>
                                    ) : (
                                        <form onSubmit={handleVerifyOtp} className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-700 mb-1 uppercase">Masukkan Kode OTP WA</label>
                                                <input type="text" required value={otpCode} onChange={e => setOtpCode(e.target.value)} className="w-full px-4 py-3 border rounded-2xl text-center font-mono text-lg bg-slate-50" placeholder="123456" />
                                            </div>
                                            <button type="submit" className="w-full py-3.5 bg-success text-white font-bold rounded-2xl shadow-lg text-sm">Verifikasi & Masuk</button>
                                        </form>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            const canEdit = user.role === 'SUPER_ADMIN' || user.role === 'PENGURUS';
            const isPicCor = user.role === 'SUPER_ADMIN' || (user.role === 'PENGURUS' && user.pic_modul === 'Cor Jalan');
            const isPicJimpitan = user.role === 'SUPER_ADMIN' || (user.role === 'PENGURUS' && user.pic_modul === 'Jimpitan');

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-bgapp">
                    <div className="md:hidden bg-darker text-white px-4 py-3 flex justify-between items-center shadow">
                        <span className="font-bold text-sm">NUANSA 16A C3/C8</span>
                        <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="text-white text-xl"><i className="fa-solid fa-bars"></i></button>
                    </div>

                    <aside className={`w-full md:w-72 bg-darker text-slate-200 flex flex-col justify-between shadow-2xl z-20 ${mobileMenuOpen ? 'block' : 'hidden md:flex'}`}>
                        <div>
                            <div className="p-6 border-b border-emerald-900 flex items-center space-x-3 bg-emerald-950/40">
                                <div className="w-12 h-12 bg-primary text-white font-black rounded-xl flex items-center justify-center text-lg">16A</div>
                                <div>
                                    <h2 className="font-black text-white text-base">NUANSA 16A</h2>
                                    <p className="text-xs text-success font-bold">Blok C3 / C8 Karawang</p>
                                </div>
                            </div>
                            <nav className="p-4 space-y-1 text-sm font-medium">
                                <button onClick={() => { setActiveTab('dashboard'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'dashboard' ? 'bg-primary text-white font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}><i className="fa-solid fa-chart-pie w-5 text-success"></i><span>Dashboard</span></button>
                                <button onClick={() => { setActiveTab('pengurus'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'pengurus' ? 'bg-primary text-white font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}><i className="fa-solid fa-user-tie w-5 text-success"></i><span>Data Pengurus</span></button>
                                <button onClick={() => { setActiveTab('kas'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'kas' ? 'bg-primary text-white font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}><i className="fa-solid fa-wallet w-5 text-success"></i><span>Kas Warga</span></button>
                                <button onClick={() => { setActiveTab('cor'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'cor' ? 'bg-primary text-white font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}><i className="fa-solid fa-road w-5 text-success"></i><span>Iuran Cor Jalan</span></button>
                                <button onClick={() => { setActiveTab('jimpitan'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'jimpitan' ? 'bg-primary text-white font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}><i className="fa-solid fa-coins w-5 text-success"></i><span>Jimpitan</span></button>
                                <button onClick={() => { setActiveTab('warga'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'warga' ? 'bg-primary text-white font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}><i className="fa-solid fa-users w-5 text-success"></i><span>Data Warga</span></button>
                                <button onClick={() => { setActiveTab('aset'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'aset' ? 'bg-primary text-white font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}><i className="fa-solid fa-boxes-stacked w-5 text-success"></i><span>Data Aset</span></button>
                                {user.role === 'SUPER_ADMIN' && <button onClick={() => { setActiveTab('audit'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'audit' ? 'bg-primary text-white font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}><i className="fa-solid fa-shield-halved w-5 text-success"></i><span>Audit Log</span></button>}
                            </nav>
                        </div>
                        <div className="p-4 border-t border-emerald-900 bg-emerald-950/20 space-y-2">
                            {user.role === 'SUPER_ADMIN' && (
                                <a href="/api/admin/backup" target="_blank" className="w-full block py-2.5 bg-emerald-700 hover:bg-emerald-600 text-white rounded-xl text-xs font-bold text-center">
                                    <i className="fa-solid fa-download mr-1"></i> Backup Database (.sqlite)
                                </a>
                            )}
                            <div>
                                <p className="text-xs text-emerald-400">Login ({user.role}):</p>
                                <p className="text-sm font-bold text-white truncate">{user.nama}</p>
                            </div>
                            <button onClick={() => setUser(null)} className="w-full py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold">Keluar</button>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col min-w-0 overflow-y-auto">
                        <header className="bg-white/90 border-b px-6 py-4 flex justify-between items-center sticky top-0 z-10">
                            <div className="relative w-80">
                                <span className="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i className="fa-solid fa-magnifying-glass"></i></span>
                                <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Cari data..." className="w-full pl-10 pr-4 py-2 bg-slate-50 border rounded-2xl text-sm focus:outline-none" />
                            </div>
                            <div className="text-xs font-semibold text-slate-600">{dateStr} | {timeStr}</div>
                        </header>

                        <div className="p-4 sm:p-8 flex-1">
                            {activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="bg-gradient-to-r from-emerald-800 to-primary text-white p-6 rounded-3xl shadow-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                        <div>

                            <form onSubmit={handleSaveAgenda} className="bg-white max-w-md w-full rounded-3xl p-6 space-y-4">
                                <h3 className="font-black text-darker text-lg">Tambah Agenda Kegiatan Warga</h3>
                                <div><label className="block text-xs font-bold mb-1">Judul Kegiatan</label><input type="text" required value={formAgenda.judul} onChange={e => setFormAgenda({...formAgenda, judul: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm" /></div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div><label className="block text-xs font-bold mb-1">Tanggal</label><input type="date" required value={formAgenda.tanggal} onChange={e => setFormAgenda({...formAgenda, tanggal: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm" /></div>
                                    <div><label className="block text-xs font-bold mb-1">Waktu</label><input type="text" value={formAgenda.waktu} onChange={e => setFormAgenda({...formAgenda, waktu: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm" /></div>
                                </div>
                                <div><label className="block text-xs font-bold mb-1">Lokasi</label><input type="text" value={formAgenda.lokasi} onChange={e => setFormAgenda({...formAgenda, lokasi: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm" /></div>
                                <div><label className="block text-xs font-bold mb-1">Deskripsi</label><textarea value={formAgenda.deskripsi} onChange={e => setFormAgenda({...formAgenda, deskripsi: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm"></textarea></div>
                                <div className="flex gap-2 pt-2">
                                    <button type="button" onClick={() => setShowModalAgenda(false)} className="flex-1 py-2.5 bg-slate-200 text-slate-700 font-bold rounded-xl text-xs">Batal</button>
                                    <button type="submit" className="flex-1 py-2.5 bg-primary text-white font-bold rounded-xl text-xs">Simpan Agenda</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* MODAL PENGELUARAN */}
                    {showModalPengeluaran && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <form onSubmit={handleSavePengeluaran} className="bg-white max-w-md w-full rounded-3xl p-6 space-y-4">
                                <h3 className="font-black text-darker text-lg">Catat Pengeluaran Kas</h3>
                                <div><label className="block text-xs font-bold mb-1">Tanggal</label><input type="date" required value={formPengeluaran.tanggal} onChange={e => setFormPengeluaran({...formPengeluaran, tanggal: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm" /></div>
                                <div><label className="block text-xs font-bold mb-1">Uraian / Keperluan</label><input type="text" required value={formPengeluaran.uraian} onChange={e => setFormPengeluaran({...formPengeluaran, uraian: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm" placeholder="Contoh: Perbaikan lampu jalan RT" /></div>
                                <div><label className="block text-xs font-bold mb-1">Nominal Keluar (Rp)</label><input type="number" required value={formPengeluaran.keluar} onChange={e => setFormPengeluaran({...formPengeluaran, keluar: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm font-bold text-red-600" /></div>
                                <div className="flex gap-2 pt-2">
                                    <button type="button" onClick={() => setShowModalPengeluaran(false)} className="flex-1 py-2.5 bg-slate-200 text-slate-700 font-bold rounded-xl text-xs">Batal</button>
                                    <button type="submit" className="flex-1 py-2.5 bg-red-600 text-white font-bold rounded-xl text-xs">Simpan Pengeluaran</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* MODAL TAMBAH / EDIT WARGA */}
                    {showModalWarga && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <form onSubmit={handleSaveWarga} className="bg-white max-w-md w-full rounded-3xl p-6 space-y-4">
                                <h3 className="font-black text-darker text-lg">{editWargaId ? 'Edit Data Warga' : 'Tambah Data Warga'}</h3>
                                <div><label className="block text-xs font-bold mb-1">Nomor Rumah (Cth: C3-01)</label><input type="text" required value={formWarga.nomor_rumah} onChange={e => setFormWarga({...formWarga, nomor_rumah: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm" /></div>
                                <div><label className="block text-xs font-bold mb-1">Nama Kepala Keluarga</label><input type="text" required value={formWarga.nama} onChange={e => setFormWarga({...formWarga, nama: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm" /></div>
                                <div><label className="block text-xs font-bold mb-1">Alamat / Blok</label><input type="text" value={formWarga.alamat} onChange={e => setFormWarga({...formWarga, alamat: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm" /></div>
                                <div><label className="block text-xs font-bold mb-1">No. WhatsApp (Untuk Login OTP)</label><input type="text" value={formWarga.no_hp} onChange={e => setFormWarga({...formWarga, no_hp: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm" placeholder="08xxxxxxxxxx" /></div>
                                <div className="flex gap-2 pt-2">
                                    <button type="button" onClick={() => setShowModalWarga(false)} className="flex-1 py-2.5 bg-slate-200 text-slate-700 font-bold rounded-xl text-xs">Batal</button>
                                    <button type="submit" className="flex-1 py-2.5 bg-primary text-white font-bold rounded-xl text-xs">Simpan Warga</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* MODAL PENGURUS */}
                    {showModalLeader && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <form onSubmit={handleSaveLeader} className="bg-white max-w-md w-full rounded-3xl p-6 space-y-4">
                                <h3 className="font-black text-darker text-lg">Tambah Pengurus & PIC</h3>
                                <div><label className="block text-xs font-bold mb-1">Nama Lengkap</label><input type="text" required value={formLeader.nama} onChange={e => setFormLeader({...formLeader, nama: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm" /></div>
                                <div><label className="block text-xs font-bold mb-1">Jabatan</label><input type="text" required value={formLeader.jabatan} onChange={e => setFormLeader({...formLeader, jabatan: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm" /></div>
                                <div><label className="block text-xs font-bold mb-1">Alamat Rumah</label><input type="text" value={formLeader.alamat} onChange={e => setFormLeader({...formLeader, alamat: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm" placeholder="Blok C3 No..." /></div>
                                <div><label className="block text-xs font-bold mb-1">No. WhatsApp (Untuk Login OTP)</label><input type="text" required value={formLeader.no_hp} onChange={e => setFormLeader({...formLeader, no_hp: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm" placeholder="08xxxxxxxxxx" /></div>
                                <div>
                                    <label className="block text-xs font-bold mb-1">PIC Modul Tugas</label>
                                    <select value={formLeader.pic_modul} onChange={e => setFormLeader({...formLeader, pic_modul: e.target.value})} className="w-full p-2.5 border rounded-xl text-sm">
                                        <option value="Kas Gang">Kas Gang</option>
                                        <option value="Cor Jalan">Cor Jalan</option>
                                        <option value="Jimpitan">Jimpitan</option>
                                    </select>
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="button" onClick={() => setShowModalLeader(false)} className="flex-1 py-2.5 bg-slate-200 text-slate-700 font-bold rounded-xl text-xs">Batal</button>
                                    <button type="submit" className="flex-1 py-2.5 bg-primary text-white font-bold rounded-xl text-xs">Simpan Pengurus</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
