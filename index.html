<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Administrasi Warga - NUANSA 16A C3/C8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#15803d',
                        success: '#22c55e',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        bgapp: '#f0fdf4',
                        darker: '#14532d'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bgapp text-slate-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [user, setUser] = React.useState(null);
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [stats, setStats] = React.useState({});
            const [members, setMembers] = React.useState([]);
            const [leaders, setLeaders] = React.useState([]);
            const [assets, setAssets] = React.useState([]);
            const [keuangan, setKeuangan] = React.useState([]);
            const [auditLogs, setAuditLogs] = React.useState([]);
            const [searchQuery, setSearchQuery] = React.useState('');
            const [mobileMenuOpen, setMobileMenuOpen] = React.useState(false);

            // Login State Selection
            const [loginMode, setLoginMode] = React.useState('admin');
            const [loginEmail, setLoginEmail] = React.useState('');
            const [loginPassword, setLoginPassword] = React.useState('');
            
            // OTP State
            const [phoneNum, setPhoneNum] = React.useState('');
            const [otpSent, setOtpSent] = React.useState(false);
            const [otpCode, setOtpCode] = React.useState('');
            const [devOtpInfo, setDevOtpInfo] = React.useState('');
            
            const [loginError, setLoginError] = React.useState('');
            const [loginMessage, setLoginMessage] = React.useState('');

            // Modal Input Warga
            const [showModalWarga, setShowModalWarga] = React.useState(false);
            const [formWarga, setFormWarga] = React.useState({ nik: '', nama: '', alamat: '', no_hp: '', kategori: 'Warga Tetap', status_iuran: 'Belum Bayar', tabungan_cor: 0, tunggakan: 0, keterangan: '' });

            // Modal Input Pengurus (Admin Only)
            const [showModalLeader, setShowModalLeader] = React.useState(false);
            const [formLeader, setFormLeader] = React.useState({ nama: '', jabatan: 'Pengurus Gang', no_hp: '', pic_modul: 'Kas Gang' });

            // Modal Input Keuangan
            const [showModalKeuangan, setShowModalKeuangan] = React.useState(false);
            const [formKeuangan, setFormKeuangan] = React.useState({
                kategori_transaksi: 'Kas',
                tanggal: new Date().toISOString().slice(0, 10),
                uraian: '',
                jenis: 'masuk',
                nominal: 0
            });

            const [timeStr, setTimeStr] = React.useState('');
            const [dateStr, setDateStr] = React.useState('');

            React.useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    setTimeStr(now.toLocaleTimeString('id-ID'));
                    setDateStr(now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }));
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const fetchData = async () => {
                try {
                    const resStats = await fetch('/api/dashboard/stats');
                    const dStats = await resStats.json();
                    if (dStats.success) setStats(dStats.stats);

                    const resMem = await fetch('/api/members');
                    const dMem = await resMem.json();
                    if (dMem.success) setMembers(dMem.data);

                    const resLead = await fetch('/api/leaders');
                    const dLead = await resLead.json();
                    if (dLead.success) setLeaders(dLead.data);

                    const resAsset = await fetch('/api/assets');
                    const dAsset = await resAsset.json();
                    if (dAsset.success) setAssets(dAsset.data);

                    const resKeu = await fetch('/api/keuangan');
                    const dKeu = await resKeu.json();
                    if (dKeu.success) setKeuangan(dKeu.data);

                    const resAudit = await fetch('/api/audit-logs');
                    const dAudit = await resAudit.json();
                    if (dAudit.success) setAuditLogs(dAudit.data);
                } catch (e) {
                    console.error('Gagal mengambil data:', e);
                }
            };

            React.useEffect(() => {
                if (user) {
                    fetchData();
                    const interval = setInterval(fetchData, 5000);
                    return () => clearInterval(interval);
                }
            }, [user]);

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                setLoginError('');
                try {
                    const res = await fetch('/api/login/admin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: loginEmail, password: loginPassword })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setUser(data.user);
                    } else {
                        setLoginError(data.message || 'Login gagal.');
                    }
                } catch (err) {
                    setLoginError('Terjadi kesalahan koneksi.');
                }
            };

            const handleRequestOtp = async (e) => {
                e.preventDefault();
                setLoginError('');
                setLoginMessage('');
                try {
                    const roleTarget = loginMode === 'pengurus' ? 'PENGURUS' : 'WARGA';
                    const res = await fetch('/api/auth/request-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ no_hp: phoneNum, role_target: roleTarget })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setOtpSent(true);
                        setLoginMessage(data.message);
                        if(data.dev_otp) setDevOtpInfo(data.dev_otp);
                    } else {
                        setLoginError(data.message);
                    }
                } catch (err) {
                    setLoginError('Gagal mengirim permintaan OTP.');
                }
            };

            const handleVerifyOtp = async (e) => {
                e.preventDefault();
                setLoginError('');
                try {
                    const roleTarget = loginMode === 'pengurus' ? 'PENGURUS' : 'WARGA';
                    const res = await fetch('/api/auth/verify-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ no_hp: phoneNum, otp: otpCode, role_target: roleTarget })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setUser(data.user);
                    } else {
                        setLoginError(data.message);
                    }
                } catch (err) {
                    setLoginError('Verifikasi OTP gagal.');
                }
            };

            const handleSaveWarga = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/members', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ...formWarga, actor: user.nama })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setShowModalWarga(false);
                        setFormWarga({ nik: '', nama: '', alamat: '', no_hp: '', kategori: 'Warga Tetap', status_iuran: 'Belum Bayar', tabungan_cor: 0, tunggakan: 0, keterangan: '' });
                        fetchData();
                    }
                } catch (err) {
                    alert('Gagal menyimpan data warga');
                }
            };

            const handleSaveLeader = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/leaders', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ...formLeader, actor: user.nama })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setShowModalLeader(false);
                        setFormLeader({ nama: '', jabatan: 'Pengurus Gang', no_hp: '', pic_modul: 'Kas Gang' });
                        fetchData();
                    }
                } catch (err) {
                    alert('Gagal menyimpan pengurus');
                }
            };

            const handleDeleteLeader = async (id) => {
                if(!confirm('Hapus data pengurus ini?')) return;
                try {
                    await fetch(`/api/leaders/${id}`, { method: 'DELETE' });
                    fetchData();
                } catch (e) {
                    alert('Gagal menghapus pengurus');
                }
            };

            const openModalKeuangan = (kategori) => {
                setFormKeuangan({
                    kategori_transaksi: kategori,
                    tanggal: new Date().toISOString().slice(0, 10),
                    uraian: '',
                    jenis: 'masuk',
                    nominal: 0
                });
                setShowModalKeuangan(true);
            };

            const handleSaveKeuangan = async (e) => {
                e.preventDefault();
                try {
                    const payload = {
                        kategori_transaksi: formKeuangan.kategori_transaksi,
                        tanggal: formKeuangan.tanggal,
                        uraian: formKeuangan.uraian,
                        masuk: formKeuangan.jenis === 'masuk' ? Number(formKeuangan.nominal) : 0,
                        keluar: formKeuangan.jenis === 'keluar' ? Number(formKeuangan.nominal) : 0,
                        input_oleh: user.nama
                    };
                    const res = await fetch('/api/keuangan', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (data.success) {
                        setShowModalKeuangan(false);
                        fetchData();
                    }
                } catch (err) {
                    alert('Gagal menyimpan transaksi');
                }
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-darker px-4 py-8">
                        <div className="bg-white max-w-md w-full rounded-3xl shadow-2xl p-8 border border-emerald-800">
                            <div className="text-center mb-6">
                                <div className="w-16 h-16 bg-primary text-white text-xl font-black rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-3">16A</div>
                                <h1 className="text-xl font-black text-darker">NUANSA 16A C3/C8</h1>
                                <p className="text-xs font-semibold text-primary mt-1">Sistem Administrasi Warga Digital</p>
                            </div>

                            <div className="grid grid-cols-3 gap-2 mb-6 bg-slate-100 p-1 rounded-2xl text-xs font-bold text-center">
                                <button type="button" onClick={() => { setLoginMode('admin'); setOtpSent(false); setLoginError(''); }} className={`py-2 rounded-xl transition ${loginMode === 'admin' ? 'bg-primary text-white shadow' : 'text-slate-600'}`}>Admin</button>
                                <button type="button" onClick={() => { setLoginMode('pengurus'); setOtpSent(false); setLoginError(''); }} className={`py-2 rounded-xl transition ${loginMode === 'pengurus' ? 'bg-primary text-white shadow' : 'text-slate-600'}`}>Pengurus</button>
                                <button type="button" onClick={() => { setLoginMode('warga'); setOtpSent(false); setLoginError(''); }} className={`py-2 rounded-xl transition ${loginMode === 'warga' ? 'bg-primary text-white shadow' : 'text-slate-600'}`}>Warga</button>
                            </div>

                            {loginError && <div className="mb-4 p-3 bg-red-50 text-red-600 rounded-xl text-xs border border-red-200 font-semibold">{loginError}</div>}
                            {loginMessage && <div className="mb-4 p-3 bg-emerald-50 text-emerald-700 rounded-xl text-xs border border-emerald-200 font-semibold">{loginMessage}</div>}
                            
                            {devOtpInfo && (
                                <div className="mb-4 p-3 bg-amber-50 text-amber-800 rounded-xl text-xs border border-amber-200">
                                    💡 <b>Simulasi OTP WhatsApp:</b> <span className="font-mono font-bold text-sm">{devOtpInfo}</span>
                                </div>
                            )}

                            {loginMode === 'admin' && (
                                <form onSubmit={handleAdminLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Email Super Admin</label>
                                        <input type="email" required value={loginEmail} onChange={e => setLoginEmail(e.target.value)} className="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary focus:outline-none text-sm bg-slate-50" placeholder="admin@nuansa16a.com" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Password</label>
                                        <input type="password" required value={loginPassword} onChange={e => setLoginPassword(e.target.value)} className="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary focus:outline-none text-sm bg-slate-50" placeholder="••••••••••••" />
                                    </div>
                                    <button type="submit" className="w-full py-3.5 bg-primary hover:bg-darker text-white font-bold rounded-2xl shadow-lg transition duration-200 text-sm">Masuk sebagai Admin</button>
                                </form>
                            )}

                            {(loginMode === 'pengurus' || loginMode === 'warga') && (
                                <div>
                                    {!otpSent ? (
                                        <form onSubmit={handleRequestOtp} className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Nomor WhatsApp Terdaftar</label>
                                                <input type="text" required value={phoneNum} onChange={e => setPhoneNum(e.target.value)} className="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary focus:outline-none text-sm bg-slate-50" placeholder="08xxxxxxxxxx" />
                                            </div>
                                            <button type="submit" className="w-full py-3.5 bg-primary hover:bg-darker text-white font-bold rounded-2xl shadow-lg transition duration-200 text-sm">Kirim Kode OTP WhatsApp</button>
                                        </form>
                                    ) : (
                                        <form onSubmit={handleVerifyOtp} className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Masukkan Kode OTP</label>
                                                <input type="text" required value={otpCode} onChange={e => setOtpCode(e.target.value)} className="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary focus:outline-none text-sm bg-slate-50 text-center font-mono tracking-widest text-lg" placeholder="123456" />
                                            </div>
                                            <button type="submit" className="w-full py-3.5 bg-success hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-lg transition duration-200 text-sm">Verifikasi & Masuk</button>
                                            <button type="button" onClick={() => setOtpSent(false)} className="w-full text-xs text-slate-500 font-bold hover:underline pt-2">Kirim ulang nomor lain</button>
                                        </form>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            const canEdit = user.role === 'SUPER_ADMIN' || user.role === 'PENGURUS';
            const filteredMembers = members.filter(m => 
                m.nama.toLowerCase().includes(searchQuery.toLowerCase()) || 
                (m.alamat && m.alamat.toLowerCase().includes(searchQuery.toLowerCase()))
            );

            const renderKeuanganTab = (kategoriKode, judul, subjudul, saldoSaatIni) => {
                const listTrx = keuangan.filter(k => k.kategori_transaksi === kategoriKode && 
                    (k.uraian && k.uraian.toLowerCase().includes(searchQuery.toLowerCase()) || searchQuery === '')
                );
                return (
                    <div className="bg-white/90 backdrop-blur-sm rounded-3xl shadow-sm border border-emerald-100 p-6">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                            <div>
                                <h3 className="text-lg font-black text-darker">{judul}</h3>
                                <p className="text-xs text-slate-500">{subjudul}</p>
                            </div>
                            <div className="flex items-center space-x-3">
                                <div className="px-4 py-2 bg-emerald-50 border border-emerald-200 rounded-2xl">
                                    <span className="text-xs text-slate-500 block">Saldo Terkumpul:</span>
                                    <span className="text-base font-black text-primary">Rp {(saldoSaatIni || 0).toLocaleString()}</span>
                                </div>
                                {canEdit && (
                                    <button onClick={() => openModalKeuangan(kategoriKode)} className="px-5 py-3 bg-primary hover:bg-darker text-white font-bold rounded-2xl text-xs shadow-md transition flex items-center space-x-2">
                                        <i className="fa-solid fa-plus"></i><span>Catat Transaksi (PIC)</span>
                                    </button>
                                )}
                            </div>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm text-slate-600">
                                <thead className="bg-emerald-50/70 text-darker font-bold border-b border-emerald-100 text-xs uppercase tracking-wider">
                                    <tr>
                                        <th className="p-3.5 rounded-l-xl">Tanggal</th>
                                        <th className="p-3.5">Uraian / Keterangan</th>
                                        <th className="p-3.5">Pemasukan</th>
                                        <th className="p-3.5">Pengeluaran</th>
                                        <th className="p-3.5 rounded-r-xl">PIC (Dicatat Oleh)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {listTrx.map(t => (
                                        <tr key={t.id} className="border-b border-slate-100 hover:bg-emerald-50/30 transition">
                                            <td className="p-3.5 font-semibold text-slate-700">{t.tanggal}</td>
                                            <td className="p-3.5">{t.uraian}</td>
                                            <td className="p-3.5 font-bold text-emerald-600">{t.masuk > 0 ? `+ Rp ${t.masuk.toLocaleString()}` : '-'}</td>
                                            <td className="p-3.5 font-bold text-red-600">{t.keluar > 0 ? `- Rp ${t.keluar.toLocaleString()}` : '-'}</td>
                                            <td className="p-3.5 text-xs text-slate-500 font-medium">{t.input_oleh}</td>
                                        </tr>
                                    ))}
                                    {listTrx.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-slate-400">Belum ada riwayat transaksi.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-bgapp">
                    {/* Mobile Header */}
                    <div className="md:hidden bg-darker text-white px-4 py-3 flex justify-between items-center shadow-md">
                        <div className="flex items-center space-x-3">
                            <div className="w-8 h-8 bg-primary text-white font-bold rounded-lg flex items-center justify-center text-xs">16A</div>
                            <span className="font-bold text-sm">NUANSA 16A C3/C8</span>
                        </div>
                        <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="text-white text-xl focus:outline-none">
                            <i className={`fa-solid ${mobileMenuOpen ? 'fa-xmark' : 'fa-bars'}`}></i>
                        </button>
                    </div>

                    {/* Sidebar / Drawer */}
                    <aside className={`w-full md:w-72 bg-darker text-slate-200 flex flex-col justify-between shadow-2xl z-25 transition-all duration-300 ${mobileMenuOpen ? 'block' : 'hidden md:flex'}`}>
                        <div>
                            <div className="p-6 border-b border-emerald-900 flex items-center space-x-3.5 bg-emerald-950/40">
                                <div className="w-12 h-12 bg-primary text-white font-black rounded-xl flex items-center justify-center shadow-md border border-emerald-600 text-lg">16A</div>
                                <div>
                                    <h2 className="font-black text-white text-base tracking-wide">NUANSA 16A</h2>
                                    <p className="text-xs text-success font-bold">Blok C3 / C8 Karawang</p>
                                </div>
                            </div>
                            <nav className="p-4 space-y-1.5 text-sm font-medium">
                                <button onClick={() => { setActiveTab('dashboard'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'dashboard' ? 'bg-primary text-white shadow-lg font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}>
                                    <i className="fa-solid fa-chart-pie w-5 text-success"></i><span>Dashboard Eksekutif</span>
                                </button>
                                <button onClick={() => { setActiveTab('pengurus'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'pengurus' ? 'bg-primary text-white shadow-lg font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}>
                                    <i className="fa-solid fa-user-tie w-5 text-success"></i><span>Data Pengurus & PIC</span>
                                </button>
                                <button onClick={() => { setActiveTab('kas'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'kas' ? 'bg-primary text-white shadow-lg font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}>
                                    <i className="fa-solid fa-wallet w-5 text-success"></i><span>Kas Warga</span>
                                </button>
                                <button onClick={() => { setActiveTab('cor'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'cor' ? 'bg-primary text-white shadow-lg font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}>
                                    <i className="fa-solid fa-road w-5 text-success"></i><span>Iuran Cor Jalan</span>
                                </button>
                                <button onClick={() => { setActiveTab('jimpitan'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'jimpitan' ? 'bg-primary text-white shadow-lg font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}>
                                    <i className="fa-solid fa-coins w-5 text-success"></i><span>Jimpitan</span>
                                </button>
                                <button onClick={() => { setActiveTab('warga'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'warga' ? 'bg-primary text-white shadow-lg font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}>
                                    <i className="fa-solid fa-users w-5 text-success"></i><span>Data Warga</span>
                                </button>
                                <button onClick={() => { setActiveTab('aset'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'aset' ? 'bg-primary text-white shadow-lg font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}>
                                    <i className="fa-solid fa-boxes-stacked w-5 text-success"></i><span>Data Aset</span>
                                </button>
                                {user.role === 'SUPER_ADMIN' && (
                                    <>
                                        <button onClick={() => { setActiveTab('audit'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'audit' ? 'bg-primary text-white shadow-lg font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}>
                                            <i className="fa-solid fa-shield-halved w-5 text-success"></i><span>Audit Log</span>
                                        </button>
                                        <button onClick={() => { setActiveTab('backup'); setMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl transition ${activeTab === 'backup' ? 'bg-primary text-white shadow-lg font-bold' : 'hover:bg-emerald-900/50 text-slate-300'}`}>
                                            <i className="fa-solid fa-database w-5 text-success"></i><span>Backup Database</span>
                                        </button>
                                    </>
                                )}
                            </nav>
                        </div>
                        <div className="p-4 border-t border-emerald-900 bg-emerald-950/20">
                            <div className="mb-3 px-3">
                                <p className="text-xs text-emerald-400 font-semibold">Login sebagai ({user.role}):</p>

                                            <select value={formWarga.status_iuran} onChange={e => setFormWarga({...formWarga, status_iuran: e.target.value})} className="w-full px-4 py-2.5 border rounded-2xl text-sm bg-slate-50 focus:ring-2 focus:ring-primary focus:outline-none">
                                                <option value="Belum Bayar">Belum Bayar</option>
                                                <option value="Sudah Bayar">Sudah Bayar</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1">Tabungan Cor (Rp)</label>
                                            <input type="number" value={formWarga.tabungan_cor} onChange={e => setFormWarga({...formWarga, tabungan_cor: Number(e.target.value)})} className="w-full px-4 py-2.5 border rounded-2xl text-sm bg-slate-50 focus:ring-2 focus:ring-primary focus:outline-none" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1">Tunggakan (Rp)</label>
                                            <input type="number" value={formWarga.tunggakan} onChange={e => setFormWarga({...formWarga, tunggakan: Number(e.target.value)})} className="w-full px-4 py-2.5 border rounded-2xl text-sm bg-slate-50 focus:ring-2 focus:ring-primary focus:outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1">Keterangan</label>
                                            <input type="text" value={formWarga.keterangan} onChange={e => setFormWarga({...formWarga, keterangan: e.target.value})} className="w-full px-4 py-2.5 border rounded-2xl text-sm bg-slate-50 focus:ring-2 focus:ring-primary focus:outline-none" placeholder="Catatan" />
                                        </div>
                                    </div>
                                    <div className="flex justify-end space-x-3 pt-4">
                                        <button type="button" onClick={() => setShowModalWarga(false)} className="px-5 py-2.5 bg-slate-200 text-slate-700 rounded-2xl text-xs font-bold hover:bg-slate-300">Batal</button>
                                        <button type="submit" className="px-5 py-2.5 bg-primary text-white rounded-2xl text-xs font-bold hover:bg-darker shadow-md">Simpan Data</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
